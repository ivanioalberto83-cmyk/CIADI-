emplate-columns:1fr}.invoice-totals{width:100%}}@media print{body{background:#fff!important}.invoice-a4{box-shadow:none;width:210mm;min-height:297mm;margin:0;padding:12mm}.a4-preview-shell{padding:0;background:#fff}.invoice-a4{page-break-after:always}}

function initSupabase(){

const JANETH_AVATAR_SVG=`<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="j" x1="0" x2="1"><stop stop-color="#f58200"/><stop offset="1" stop-color="#ffdf19"/></linearGradient></defs><circle cx="64" cy="64" r="62" fill="#fff7ed"/><circle cx="64" cy="57" r="34" fill="url(#j)"/><path d="M39 50c8-17 42-17 50 0" fill="none" stroke="#6f351f" stroke-width="5" stroke-linecap="round"/><circle cx="52" cy="61" r="4" fill="#6f351f"/><circle cx="76" cy="61" r="4" fill="#6f351f"/><path d="M52 75c8 7 16 7 24 0" fill="none" stroke="#6f351f" stroke-width="4" stroke-linecap="round"/><path d="M45 91c9-8 29-8 38 0" fill="#f58200"/></svg>`;
const menu=[['overview','Visão geral'],['financeiro','💰 Financeiro'],['faturacao','🧾 Faturação'],['clientes','Clientes'],['fornecedores','Fornecedores'],['caixa','💵 Caixa & Tesouraria'],['sos','🚨 Alertas'],['aprovisionamento','📦 Aprovisionamento'],['rh','👥 Recursos Humanos'],['pedidos_site','Pedidos de triagem (site)'],['agendamentos','Agendamentos Clínicos'],['contabilidade','📊 Contabilidade'],['saft','📦 SAF-T(AO)'],['especialidades','Especialidades'],['triagens','Triagens'],['pacientes','Pacientes & famílias'],['profissionais','Profissionais'],['documentos','Documentos & Formulários Clínicos'],['familias','Portal & famílias'],['conteudos','Conteúdos do site'],['multimedia','Conteúdos Multimédia'],['marketing','Marketing Digital'],['janeth','Janeth'],['utilizadores','Utilizadores'],['instituicao','Instituição & redes'],['empresas','🏢 Empresas & Emitente'],['clinica','Clínica virtual'],['auditoria','Auditoria'],['acompanhantes_at','Acompanhantes Terapêuticos (A.T.)']];
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),3000)}
// Perfis de autenticação vêm exclusivamente de public.perfis no Supabase.
 // O perfil escolhido no Setup Windows identifica a estação e nunca concede permissões.
 // Princípio de privilégio mínimo: módulos com listagens globais de pacientes,
 // profissionais ou documentos ficam fora do perfil profissional até validar o RLS
 // e os filtros por atribuição na base de dados. A matriz da UI não substitui RLS.
 const SUPPORT_ONLY_MODULES = Object.freeze(['centro_suporte_informatico','suporte_informatico','agente_ia_suporte']);
 const MODULE_ACCESS = Object.freeze({
   // Admin tem gestão global do CIADI, mas nunca entra no Centro de Suporte Informático.
   admin: '*',
   suporte: ['overview','instituicao','auditoria','centro_suporte_informatico','suporte_informatico','agente_ia_suporte'],
   // Receção usa o perfil operador existente até a migração formal de perfis ser validada.
   operador: ['financeiro','faturacao','clientes','fornecedores','caixa','sos','aprovisionamento','pacientes'],
   // RH e Suporte são tipos de perfil previstos na aplicação; só ativar em produção após migração/RLS.
   rh: ['rh','documentos_rh','contratos_rh','ferias_licencas_rh','assiduidade_rh','formacoes_rh','avaliacoes_rh','competencias_rh','beneficios_rh','sos'],
   profissional: ['agendamentos','especialidades','triagens','clinica','documentos']
 });
 function canAccessModule(id){
   const tipo=profile?.tipo;
   if(SUPPORT_ONLY_MODULES.includes(id) && tipo!=='suporte') return false;
   const allowed=MODULE_ACCESS[tipo];
   return allowed==='*' || (Array.isArray(allowed) && allowed.includes(id));
 }
 // A.T. não tem acesso ao Dashboard administrativo; trabalha apenas no CIADI+.
 function canAccessAT(){ return profile?.tipo==='admin' && canAccessModule('acompanhantes_at'); }
 function visibleMenu(){ return menu.filter(([id])=>canAccessModule(id)); }
function nav(){document.getElementById('nav').innerHTML=visibleMenu().map(([id,n])=>`<button onclick="go('${id}')" class="w-full text-left px-3 py-2.5 rounded-xl font-semibold ${current===id?'bg-orange/10 text-orange':''}">${n}</button>`).join('')}
async function audit(acao,tabela,registro_id=null,detalhes={}){try{await sb.from('auditoria').insert({usuario_id:me.id,acao,tabela,registro_id,detalhes,user_agent:navigator.userAgent})}catch(e){console.warn(e)}}
async function go(id){const c=document.getElementById('content');if(!canAccessModule(id)){current='';nav();c.innerHTML='<div class="card p-6"><b>Acesso não autorizado.</b><p class="text-slate-500 mt-2">O seu perfil não tem permissão para abrir este módulo.</p></div>';return;}current=id;nav();c.innerHTML='<div class="card p-8">A carregar...</div>'; if(id==='overview')return overview(); if(id==='sos')return sosAlerts(); if(id==='pedidos_site')return siteTriageRequests(); if(id==='agendamentos')return appointments(); if(id==='financeiro')return financeDashboard(); if(id==='faturacao')return financeInvoices(); if(id==='clientes')return financeClients(); if(id==='fornecedores')return financeSuppliers(); if(id==='aprovisionamento')return procurementHub(); if(id==='rh')return rhHub(); if(id.endsWith('_rh'))return rhTable(id); if(id==='caixa')return financeCash(); if(id==='contabilidade')return financeAccounting(); if(id==='saft')return financeSaft(); if(id==='especialidades')return specialties(); if(id==='triagens')return triagens(); if(id==='pacientes')return patients(); if(id==='profissionais')return professionals(); if(id==='documentos')return clinicalDocumentsHub(); if(id==='familias')return familias(); if(id==='conteudos')return contents(); if(id==='multimedia')return multimedia(); if(id==='marketing')return marketing(); if(id==='janeth')return janeth(); if(id==='utilizadores')return users(); if(id==='instituicao')return institution(); if(id==='empresas')return financeCompanies(); if(id==='clinica')return clinic(); if(id==='auditoria')return auditPage(); if(id==='acompanhantes_at')return acompanhantesAT();}
async function acompanhantesAT(){
  if(!canAccessAT()){ document.getElementById('content').innerHTML='<div class="card p-6"><b>Acesso não autorizado.</b></div>'; return; }
  const isManager=['admin','gestor'].includes(profile?.tipo);
  const [patRes, prRes, atRes] = await Promise.all([
    sb.from('pacientes').select('id,nome_completo,data_nascimento').order('nome_completo'),
    sb.from('profissionais').select('id,nome_completo,registro_profissional,especialidade_id,eh_at,ativo,perfil_id').eq('ativo',true).order('nome_completo'),
    sb.from('ciadi_atribuicoes_at').select('id,profissional_id,paciente_id,agendamento_id,data_inicio,data_fim,ativo,permissoes,created_at').eq('ativo',true).order('created_at',{ascending:false})
  ]);
  if(patRes.error) throw patRes.error; if(prRes.error) throw prRes.error; if(atRes.error) throw atRes.error;
  const patients=patRes.data||[], pros=prRes.data||[], assignments=atRes.data||[];
  const myProf=pros.find(x=>x.perfil_id===me.id);
  const allowedAssignments=isManager?assignments:assignments.filter(a=>a.profissional_id===myProf?.id);
  const byP=Object.fromEntries(patients.map(x=>[x.id,x])); const byPr=Object.fromEntries(pros.map(x=>[x.id,x]));
  const atPros=pros.filter(x=>x.eh_at===true || x.perfil_id===me.id);
  document.getElementById('content').innerHTML=`
  <div class="card p-6 space-y-5">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
      <div><h2 class="text-2xl font-black">Acompanhantes Terapêuticos (A.T.)</h2><p class="text-slate-500">Atribuição controlada de A.T. a pacientes/crianças, com período e permissões.</p></div>
      ${isManager?'<button onclick="newATAssignment()" class="bg-orange text-white rounded-xl px-4 py-2 font-bold">+ Nova atribuição</button>':''}
    </div>
    ${!allowedAssignments.length?'<div class="border rounded-xl p-5 text-slate-500">Nenhuma atribuição ativa encontrada.</div>':`<div class="overflow-auto"><table class="w-full text-sm"><thead><tr class="text-left border-b"><th class="p-3">Paciente</th><th class="p-3">A.T.</th><th class="p-3">Início</th><th class="p-3">Fim</th><th class="p-3">Permissões</th><th class="p-3">Estado</th></tr></thead><tbody>${allowedAssignments.map(a=>{const p=byP[a.paciente_id]||{};const pr=byPr[a.profissional_id]||{};const perms=a.permissoes||{};return `<tr class="border-b"><td class="p-3 font-semibold">${esc(p.nome_completo||'—')}</td><td class="p-3">${esc(pr.nome_completo||'—')}<div class="text-xs text-slate-500">${esc(pr.registro_profissional||'')}</div></td><td class="p-3">${esc(a.data_inicio||'—')}</td><td class="p-3">${esc(a.data_fim||'Sem fim')}</td><td class="p-3">${Object.entries(perms).filter(([,v])=>v===true).map(([k])=>esc(k.replaceAll('_',' '))).join(', ')||'—'}</td><td class="p-3"><span class="px-2 py-1 rounded-full bg-emerald-50 text-emerald-700">Ativa</span></td></tr>`}).join('')}</tbody></table></div>`}
  </div>
  <div class="card p-6 mt-5">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3"><div><h3 class="text-xl font-black">Formulários A.T.</h3><p class="text-sm text-slate-500">Registo diário, comportamento/ABC, habilidades e incidentes.</p></div><div class="flex flex-wrap gap-2"><button onclick="openATForm('diario')" class="bg-orange text-white rounded-xl px-3 py-2 font-bold">+ Registo diário</button><button onclick="openATForm('comportamento')" class="border rounded-xl px-3 py-2 font-bold">+ Comportamento / ABC</button><button onclick="openATForm('habilidades')" class="border rounded-xl px-3 py-2 font-bold">+ Habilidades</button><button onclick="openATForm('incidente')" class="border rounded-xl px-3 py-2 font-bold">+ Incidente</button></div></div>
  </div>`;
}
async function newATAssignment(){
  if(profile?.tipo!=='admin'){toast('Apenas o Administrador pode gerir atribuições A.T. no Dashboard.');return;}
  const [pRes,prRes]=await Promise.all([sb.from('pacientes').select('id,nome_completo').order('nome_completo'),sb.from('profissionais').select('id,nome_completo,registro_profissional,eh_at,ativo').eq('ativo',true).order('nome_completo')]);
  if(pRes.error||prRes.error) throw (pRes.error||prRes.error);
  const patients=pRes.data||[], pros=prRes.data||[];
  if(!pros.length){toast('Não existem profissionais ativos cadastrados.');return;}
  const body=`<div class="space-y-3"><label class="block"><span class="text-sm font-semibold">Acompanhante Terapêutico (A.T.)</span><select id="at_prof" class="w-full border rounded-xl p-3">${pros.map(x=>`<option value="${x.id}">${esc(x.nome_completo)}${x.registro_profissional?' · '+esc(x.registro_profissional):''}</option>`).join('')}</select></label><label class="block"><span class="text-sm font-semibold">Paciente / criança</span><select id="at_pac" class="w-full border rounded-xl p-3">${patients.map(x=>`<option value="${x.id}">${esc(x.nome_completo)}</option>`).join('')}</select></label><div class="grid md:grid-cols-2 gap-3"><label>Início<input id="at_ini" type="date" value="${new Date().toISOString().slice(0,10)}" class="w-full border rounded-xl p-3"></label><label>Fim (opcional)<input id="at_fim" type="date" class="w-full border rounded-xl p-3"></label></div><div class="text-sm font-semibold">Permissões</div><div class="grid md:grid-cols-2 gap-2">${[['ver_agenda','Ver agenda'],['registar_acompanhamento','Registar acompanhamento'],['ver_plano','Ver plano terapêutico'],['ver_documentos_autorizados','Ver documentos autorizados']].map(([k,l])=>`<label class="border rounded-xl p-3 flex gap-2"><input id="perm_${k}" type="checkbox" checked> ${l}</label>`).join('')}</div><div class="flex justify-end gap-2"><button onclick="closeModal()" class="border rounded-xl px-4 py-2">Cancelar</button><button onclick="saveATAssignment()" class="bg-orange text-white rounded-xl px-4 py-2 font-bold">Guardar</button></div></div>`;
  openModal('Nova atribuição de A.T.',body);
}
async function ensureATProfessional(profissionalId){
  const q=await sb.from('profissionais').select('id,nome_completo,eh_at,ativo').eq('id',profissionalId).maybeSingle();
  if(q.error)throw q.error; if(!q.data?.ativo)throw new Error('O profissional seleccionado está inactivo.');
  if(!q.data.eh_at){const r=await sb.rpc('ciadi_at_selecionar_profissional',{p_profissional_id:profissionalId});if(r.error)throw r.error;}
  return q.data;
}
async function openATForm(tipo){
  if(profile?.tipo!=='admin' && !myOwnATAccess()) { toast('A.T. utiliza apenas o CIADI+; acesso ao Dashboard não autorizado.'); return; }
  const [pRes,prRes]=await Promise.all([sb.from('pacientes').select('id,nome_completo').eq('ativo',true).order('nome_completo'),sb.from('profissionais').select('id,nome_completo,registro_profissional,eh_at,ativo').eq('ativo',true).order('nome_completo')]);
  if(pRes.error||prRes.error)throw(pRes.error||prRes.error);
  const patients=pRes.data||[],pros=prRes.data||[];
  if(!patients.length){toast('Cadastre primeiro um paciente ativo.');return;}
  const title={diario:'Novo Registo Diário A.T.',comportamento:'Novo Registo de Comportamento / ABC',habilidades:'Novo Registo de Habilidades',incidente:'Novo Incidente A.T.'}[tipo];
  let extra='';
  if(tipo==='diario') extra=`${textareaField('objetivo_sessao','Objetivo da sessão','',true)}${textareaField('atividades','Atividades realizadas','',true)}${textareaField('progresso_observado','Progresso observado','',true)}${textareaField('recomendacoes_familia','Recomendações à família','',true)}${textareaField('observacoes','Observações','',true)}`;
  if(tipo==='comportamento') extra=`${textareaField('antecedente','Antecedente','',true)}${textareaField('comportamento','Comportamento observado','',true)}${textareaField('consequencia','Consequência','',true)}${selectField('funcao_hipotetica','Função hipotética',[{value:'atencao',label:'Atenção'},{value:'acesso_item_atividade',label:'Acesso a item/atividade'},{value:'escape_esquiva',label:'Escape/esquiva'},{value:'automatico_sensorial',label:'Automático/sensorial'},{value:'indeterminada',label:'Indeterminada'}])}${inputField('frequencia','Frequência','','number')}${inputField('duracao_minutos','Duração (minutos)','','number')}${textareaField('estrategia_intervencao','Estratégia de intervenção','',true)}${textareaField('resposta_intervencao','Resposta à intervenção','',true)}`;

      const id=String(r.id||'').slice(0,8);
      return '<article class="border rounded-2xl p-4 bg-white"><div class="flex flex-wrap items-start justify-between gap-3"><div><div class="font-black text-lg">'+esc(r.protocolo||('SOS-'+id))+'</div><div class="text-sm text-slate-500">'+esc(when?new Date(when).toLocaleString('pt-PT'):'Data não disponível')+'</div></div><div class="flex gap-2 flex-wrap"><span class="rounded-full px-3 py-1 text-xs font-bold '+badge+'">'+esc(level)+'</span><span class="rounded-full px-3 py-1 text-xs font-bold bg-slate-100 text-slate-700">'+esc(r.estado||'aberto')+'</span></div></div><div class="grid md:grid-cols-2 gap-3 mt-3 text-sm"><div><span class="text-slate-500">Assistido:</span> <b>'+esc(patients[r.paciente_id]||'Registo associado')+'</b></div><div><span class="text-slate-500">Categoria:</span> <b>'+esc(r.categoria||r.tipo||'SOS')+'</b></div></div><p class="mt-3 whitespace-pre-wrap">'+esc(r.mensagem||r.descricao||'Sem mensagem adicional.')+'</p>'+(hasLocation?'<p class="mt-3"><a class="text-orange underline font-semibold" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps?q='+encodeURIComponent(lat+','+lon)+'">Abrir localização autorizada no mapa</a></p>':'')+'</article>';
    }).join('');

  };

    catch(e){console.warn('CIADI SOS Realtime não disponível:',e);}
  }

async function modal(title,body,onSave,saveText='Guardar'){
  const old=document.getElementById('ciadiModal'); if(old) old.remove();
  const wrap=document.createElement('div'); wrap.id='ciadiModal'; wrap.className='fixed inset-0 z-[100] bg-black/40 flex items-center justify-center p-4';
  wrap.innerHTML=`<div class="bg-white w-full max-w-4xl max-h-[92vh] overflow-auto rounded-3xl shadow-2xl"><div class="sticky top-0 bg-white border-b px-6 py-4 flex justify-between items-center"><div><h3 class="text-xl font-black">${esc(title)}</h3><p class="text-xs text-slate-500">Campos com * são obrigatórios.</p></div><button type="button" class="text-2xl" onclick="closeModal()">×</button></div><form id="ciadiModalForm" class="p-6">${body}<div class="flex justify-end gap-3 mt-6"><button type="button" class="border rounded-xl px-5 py-3" onclick="closeModal()">Cancelar</button><button class="bg-orange text-white rounded-xl px-5 py-3 font-bold">${esc(saveText)}</button></div></form></div>`;
  document.body.appendChild(wrap);
  document.getElementById('ciadiModalForm').addEventListener('submit',async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;b.textContent='A guardar…';try{await onSave(new FormData(e.currentTarget));closeModal();}catch(err){toast(err?.message||'Não foi possível guardar.');}finally{b.disabled=false;b.textContent=saveText;}});
}
function openModal(title,body){const old=document.getElementById('ciadiModal');if(old)old.remove();const wrap=document.createElement('div');wrap.id='ciadiModal';wrap.className='fixed inset-0 z-[100] bg-black/40 flex items-center justify-center p-4';wrap.innerHTML=`<div class="bg-white w-full max-w-3xl max-h-[92vh] overflow-auto rounded-3xl shadow-2xl"><div class="sticky top-0 bg-white border-b px-6 py-4 flex justify-between items-center"><h3 class="text-xl font-black">${esc(title)}</h3><button type="button" class="text-2xl" onclick="closeModal()">×</button></div><div class="p-6">${body}</div></div>`;document.body.appendChild(wrap)}
function closeModal(){document.getElementById('ciadiModal')?.remove()}
function inputField(name,label,value='',type='text',required=false,extra=''){return `<label class="block"><span class="text-sm font-semibold">${esc(label)}${required?' *':''}</span><input name="${esc(name)}" type="${type}" value="${esc(value)}" ${required?'required':''} class="mt-1 w-full border rounded-xl p-3" ${extra}></label>`}
function selectField(name,label,options,value='',required=false){return `<label class="block"><span class="text-sm font-semibold">${esc(label)}${required?' *':''}</span><select name="${esc(name)}" ${required?'required':''} class="mt-1 w-full border rounded-xl p-3"><option value="">Seleccionar…</option>${options.map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(value)?'selected':''}>${esc(o.label)}</option>`).join('')}</select></label>`}
function textareaField(name,label,value='',full=false){return `<label class="block ${full?'md:col-span-2':''}"><span class="text-sm font-semibold">${esc(label)}</span><textarea name="${esc(name)}" rows="3" class="mt-1 w-full border rounded-xl p-3">${esc(value)}</textarea></label>`}
function toLocalInput(iso){if(!iso)return '';const d=new Date(iso);const pad=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`}
function dashboardRoomLink(id){const base=window.location.href.split('#')[0].split('?')[0];return base.substring(0,base.lastIndexOf('/')+1)+'sala.html?agendamento_id='+encodeURIComponent(id)}
async function copyDashboardRoomLink(id){const link=dashboardRoomLink(id);try{await navigator.clipboard.writeText(link);toast('Link da Sala Clínica copiado.')}catch(e){window.prompt('Copie o link da Sala Clínica:',link)}}
async function prepareAppointmentRoom(id){const {data,error}=await sb.rpc('ciadi_preparar_sala_video',{p_agendamento_id:id});if(error)throw error;if(!data?.sala_id)throw new Error('A Sala Clínica não foi criada para este agendamento.');const link=dashboardRoomLink(id);const up=await sb.from('agendamentos').update({link_video:link,updated_at:new Date().toISOString()}).eq('id',id);if(up.error)throw up.error;const roomUp=await sb.from('salas_video').update({room_url:link,updated_at:new Date().toISOString()}).eq('id',data.sala_id);if(roomUp.error)console.warn('Não foi possível guardar room_url:',roomUp.error);return {room:data,link}}

function invoiceTypeLabel(t){return ({FT:'Fatura',FR:'Fatura-Recibo',NC:'Nota de Crédito',ND:'Nota de Débito',RC:'Recibo'}[t]||t||'Documento')}
function invoiceIsAdjustment(t){return ['NC','ND'].includes(t)}
function invoiceIsReceipt(t){return t==='RC'}
function invoiceDateValue(){return new Date().toISOString().slice(0,10)}
function invoiceNumberPreview(type,series,seq){return `${type||'FT'} ${series||'—'}/${seq||'—'}`}
function calcInvoiceLine(qty,price,rate,discount){const base=Math.max(0,Number(qty||0)*Number(price||0)-Number(discount||0));const tax=Math.round(base*Number(rate||0)/100*100)/100;return {base,tax,total:Math.round((base+tax)*100)/100}}
function updateA4Generator(){
  const f=document.getElementById('a4Generator'); if(!f)return;
  const type=f.querySelector('[name="tipo_documento"]')?.value||'FT';
  const series=f.querySelector('[name="serie_id"]'); const selectedSeries=series?.options[series.selectedIndex];
  const seq=selectedSeries?.dataset.seq||'—'; const code=selectedSeries?.dataset.code||'—';
  const qty=Number(f.querySelector('[name="quantidade"]')?.value||1),price=Number(f.querySelector('[name="preco_unitario"]')?.value||0),rate=Number(f.querySelector('[name="taxa_imposto"]')?.value||0),disc=Number(f.querySelector('[name="desconto"]')?.value||0);
  const line=calcInvoiceLine(qty,price,rate,disc); const total=line.total;
  const patient=f.querySelector('[name="paciente_id"]'); const pn=patient?.options[patient.selectedIndex]?.textContent||'—';
  const desc=f.querySelector('[name="descricao"]')?.value||'Serviço clínico CIADI';
  const payment=f.querySelector('[name="forma_pagamento"]')?.value||'';
  const operation=f.querySelector('[name="data_operacao"]')?.value||invoiceDateValue();
  const due=f.querySelector('[name="data_vencimento"]')?.value||'';
  const origin=f.querySelector('[name="documento_origem_id"]'); const on=origin?.options[origin.selectedIndex]?.textContent||'';
  const el=document.getElementById('a4LivePreview');
  if(!el)return;
  el.innerHTML=buildInvoiceA4Html({emitente:window.ciadiA4Emitter||{},type,code,seq,pn,desc,qty,price,rate,disc,line,payment,operation,due,origin:on,preview:true});
  const summary=document.getElementById('a4Summary'); if(summary)summary.innerHTML=`<div>Base <b>${money(line.base)}</b></div><div>Imposto <b>${money(line.tax)}</b></div><div class="text-lg">Total <b>${money(total)}</b></div>`;
  const originWrap=document.getElementById('originWrap'); if(originWrap)originWrap.classList.toggle('hidden',!invoiceIsAdjustment(type));
}

async function collectA4Draft(){
  const f=document.getElementById('a4Generator');if(!f)throw new Error('Gerador A4 não está aberto.');const fd=new FormData(f);const type=fd.get('tipo_documento'),sid=fd.get('serie_id'),pid=fd.get('paciente_id'),serviceId=fd.get('servico_id');if(!type||!sid||!pid)throw new Error('Preencha tipo, série e cliente.');if(invoiceIsAdjustment(type)&&!fd.get('documento_origem_id'))throw new Error('Notas de Crédito/Débito exigem documento de origem.');const q=Number(fd.get('quantidade')),price=Number(fd.get('preco_unitario')),rate=Number(fd.get('taxa_imposto')||0),discount=Number(fd.get('desconto')||0);if(q<=0||price<0)throw new Error('Quantidade/preço inválidos.');const calc=calcInvoiceLine(q,price,rate,discount);const [{data:pac,error:pe},{data:cli,error:ce},{data:se,error:seErr},{data:sv,error:svErr},{data:em,error:ee}]=await Promise.all([sb.from('pacientes').select('*').eq('id',pid).single(),sb.from('finance_clientes').select('*').eq('paciente_id',pid).maybeSingle(),sb.from('finance_series').select('*').eq('id',sid).single(),sb.from('finance_servicos').select('*').eq('id',serviceId).single(),sb.from('finance_emitente_config').select('*').eq('ativo',true).order('updated_at',{ascending:false}).limit(1).maybeSingle()]);if(pe)throw pe;if(seErr)throw seErr;if(svErr)throw svErr;if(ee)throw ee;return {fd,type,sid,pid,serviceId,q,price,rate,discount,calc,pac,cli,se,sv,em:em||{},descricao:fd.get('descricao')||sv.nome,observacoes:fd.get('observacoes')||'',forma_pagamento:fd.get('forma_pagamento')||null,data_operacao:fd.get('data_operacao')||invoiceDateValue(),data_vencimento:fd.get('data_vencimento')||null,documento_origem_id:fd.get('documento_origem_id')||null};
}
async function validateA4Draft(){try{const x=await collectA4Draft();const issues=[];if(!x.em.nif)issues.push('NIF do emitente não configurado.');if(!x.cli?.id)issues.push('Cliente financeiro ainda não está criado para este paciente.');if(!x.pac.nome_completo)issues.push('Paciente sem nome.');if(x.calc.total<=0)issues.push('Total deve ser superior a zero.');if(issues.length){toast('Validação: '+issues.join(' '));return false}toast('Pré-validação A4 concluída sem erros básicos.');return true}catch(e){toast(e.message);return false}}
async function emitA4Document(){
  try{
    const valid=await validateA4Draft(); if(!valid)return;
    const x=await collectA4Draft();
    const {data:emp,error:empErr}=await sb.from('finance_empresas').select('id').eq('ativo',true).eq('empresa_principal',true).maybeSingle();
    if(empErr)throw empErr;
    if(!emp?.id)throw new Error('Não existe empresa emitente principal configurada. Abra Empresas & Emitente.');
    let cli=x.cli;
    if(!cli){
      const z=await sb.from('finance_clientes').insert({empresa_id:emp.id,paciente_id:x.pid,nome:x.pac.nome_responsavel||x.pac.nome_completo,email:x.pac.email||null,telefone:x.pac.telefone||null}).select().single();
      if(z.error)throw z.error; cli=z.data;
    }
    const lines=[{servico_id:x.serviceId,codigo:x.sv.codigo,descricao:x.descricao,quantidade:x.q,unidade:x.sv.unidade||'UN',preco_unitario:x.price,desconto:x.discount,taxa_imposto:x.rate,conta_receita:x.sv.conta_receita||null}];
    const {data:d,error}=await sb.rpc('ciadi_faturacao_criar_documento',{p_empresa_id:emp.id,p_tipo_documento:x.type,p_serie_id:x.sid,p_cliente_id:cli.id,p_paciente_id:x.pid,p_agendamento_id:null,p_data_emissao:new Date().toISOString(),p_data_vencimento:x.data_vencimento||null,p_observacoes:x.observacoes||null,p_linhas:lines});
    if(error)throw error;
    const id=d?.documento_id||d?.id; if(!id)throw new Error('O documento foi criado sem identificador.');
    const {data:emissao,error:ee}=await sb.rpc('ciadi_faturacao_emitir_documento',{p_documento_id:id});
    if(ee)throw ee;
    await audit('EMITIR_DOCUMENTO_A4','finance_documentos',id,{document_no:emissao?.document_no||null,tipo:x.type,total:x.calc.total});
    toast(`${emissao?.document_no||'Documento'} emitido com sucesso.`); closeModal(); await previewFinanceInvoice(id); financeInvoices();
  }catch(e){toast(e?.message||'Não foi possível emitir o documento.')}
}

async function receiveFinanceDocument(documentId){
  try{
    const [{data:d,error:de},{data:cash,error:ce}]=await Promise.all([
      sb.from('finance_documentos').select('id,document_no,total,estado_pagamento,fiscal_status,empresa_id').eq('id',documentId).single(),
      sb.from('finance_caixas').select('id,nome,estado,empresa_id').eq('estado','aberto').order('created_at',{ascending:false})
    ]);
    if(de)throw de;if(ce)throw ce;
    if(!d)throw new Error('Documento não encontrado.');
    if(d.fiscal_status!=='emitido')throw new Error('Só é possível receber um documento emitido.');
    const {data:paid,error:pe}=await sb.from('finance_pagamentos').select('valor').eq('documento_id',documentId);
    if(pe)throw pe;
    const recebido=(paid||[]).reduce((a,x)=>a+Number(x.valor||0),0);
    const saldo=Math.max(0,Number(d.total||0)-recebido);
    if(saldo<=0){toast('Este documento já está liquidado.');return;}
    const body=`<div class="space-y-4"><div class="rounded-xl bg-slate-50 p-4"><b>${esc(d.document_no)}</b><div class="text-sm text-slate-500 mt-1">Total: ${money(d.total)} · Já recebido: ${money(recebido)} · <b>Saldo: ${money(saldo)}</b></div></div><div class="grid md:grid-cols-2 gap-4">${inputField('valor','Valor a receber',saldo,'number',true,'min="0.01" max="'+saldo.toFixed(2)+'" step="0.01"')}${selectField('metodo','Método de pagamento',[{value:'numerario',label:'Numerário'},{value:'tpa',label:'TPA'},{value:'transferencia',label:'Transferência'},{value:'multicaixa',label:'Multicaixa'},{value:'referencia',label:'Referência'},{value:'outro',label:'Outro'}],'',true)}${inputField('referencia','Referência','')}${selectField('caixa_id','Caixa aberto',(cash||[]).filter(x=>!x.empresa_id||x.empresa_id===d.empresa_id).map(x=>({value:x.id,label:x.nome})), '')}${textareaField('observacoes','Observações','')}</div></div>`;
    await modal('Receber pagamento / emitir recibo',body,async fd=>{
      const valor=Number(fd.get('valor')||0),metodo=fd.get('metodo'),caixaId=fd.get('caixa_id')||null;
      if(valor<=0||valor>saldo+0.001)throw new Error('Valor de pagamento inválido.');
      const {data:r,error}=await sb.rpc('finance_registar_pagamento',{p_documento_id:documentId,p_valor:valor,p_metodo:metodo,p_referencia:fd.get('referencia')||null,p_caixa_id:caixaId,p_observacoes:fd.get('observacoes')||null});
      if(error)throw error;
      const row=Array.isArray(r)?r[0]:r;
      if(!row?.pagamento_id)throw new Error('Pagamento registado sem identificador.');
      const integ=await sb.rpc('ciadi_finance_integrar_pagamento',{p_pagamento_id:row.pagamento_id,p_caixa_id:caixaId});
      if(integ.error)throw integ.error;
      await audit('RECEBER_PAGAMENTO','finance_pagamentos',row.pagamento_id,{documento_id:documentId,valor,metodo,recibo_id:row.recibo_id,recibo_no:row.recibo_no,integracao:integ.data});
      toast(`Pagamento registado · Recibo ${row.recibo_no||''}`);closeModal();financeInvoices();
      if(row.recibo_id)setTimeout(()=>previewFinanceInvoice(row.recibo_id),150);
    });
  }catch(e){toast(e?.message||'Não foi possível registar o pagamento.')}
}

async function selectProfessionalAsAT(id,alreadyAT){
  if(alreadyAT){go('acompanhantes_at');return;}
  const check=await sb.from('profissionais').select('id,nome_completo,registro_profissional,ativo').eq('id',id).maybeSingle();
  if(check.error){toast(check.error.message);return;}
  const professional=check.data;
  if(!professional?.ativo){toast('Este profissional está inactivo e não pode ser adicionado como A.T.');return;}
  if(!confirm(`Adicionar ${professional.nome_completo} como Acompanhante Terapêutico (A.T.)?`))return;
  const {data,error}=await sb.rpc('ciadi_at_selecionar_profissional',{p_profissional_id:id});
  if(error){toast(error.message);return;}
  await audit('TORNAR_AT','profissionais',id,data?.[0]||{profissional_id:id,nome_completo:professional.nome_completo});
  toast(`${professional.nome_completo} foi ligado à área de Acompanhante Terapêutico.`);
  await professionals();
}

function renderClinicalField(f){
  const name=esc(f.key), label=esc(f.label||f.key), req=f.required?'required':'';
  const help=f.help?`<div class="text-xs text-slate-400 mt-1">${esc(f.help)}</div>`:'';
  if(f.type==='textarea')return `<label class="block"><span class="text-sm font-semibold">${label}${f.required?' *':''}</span><textarea name="cf_${name}" ${req} rows="4" class="mt-1 w-full border rounded-xl p-3" placeholder="${esc(f.placeholder||'')}"></textarea>${help}</label>`;
  if(f.type==='select'||f.type==='radio'){const opts=(f.options||[]).map(o=>typeof o==='object'?o:{value:o,label:o});return `<label class="block"><span class="text-sm font-semibold">${label}${f.required?' *':''}</span><select name="cf_${name}" ${req} class="mt-1 w-full border rounded-xl p-3"><option value="">Seleccionar…</option>${opts.map(o=>`<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('')}</select>${help}</label>`;}
  if(f.type==='multiselect'){const opts=(f.options||[]).map(o=>typeof o==='object'?o:{value:o,label:o});return `<fieldset class="border rounded-xl p-3"><legend class="text-sm font-semibold px-1">${label}${f.required?' *':''}</legend><div class="grid md:grid-cols-2 gap-2">${opts.map(o=>`<label class="flex gap-2 items-center"><input type="checkbox" name="cf_${name}" value="${esc(o.value)}">${esc(o.label)}</label>`).join('')}</div>${help}</fieldset>`;}
  if(f.type==='boolean'||f.type==='checkbox')return `<label class="flex gap-2 items-center border rounded-xl p-3"><input type="checkbox" name="cf_${name}" value="true"> <span class="text-sm font-semibold">${label}</span></label>`;
  if(f.type==='number'||f.type==='date'||f.type==='datetime')return `<label class="block"><span class="text-sm font-semibold">${label}${f.required?' *':''}</span><input name="cf_${name}" type="${f.type==='datetime'?'datetime-local':f.type}" ${req} class="mt-1 w-full border rounded-xl p-3" placeholder="${esc(f.placeholder||'')}">${help}</label>`;
  return `<label class="block"><span class="text-sm font-semibold">${label}${f.required?' *':''}</span><input name="cf_${name}" type="text" ${req} class="mt-1 w-full border rounded-xl p-3" placeholder="${esc(f.placeholder||'')}">${help}</label>`;
}

async function newClinicalEvaluation(formId=''){
  const [{data:forms,error:fe},{data:patients,error:pe},{data:pros,error:pr}]=await Promise.all([
    sb.from('ciadi_formularios_clinicos').select('*').eq('ativo',true).eq('publicado',true).order('nome'),
    sb.from('pacientes').select('id,nome_completo,data_nascimento,ativo').eq('ativo',true).order('nome_completo'),
    sb.from('profissionais').select('id,nome_completo,registro_profissional,especialidade_id,ativo').eq('ativo',true).order('nome_completo')
  ]);
  if(fe||pe||pr)return toast((fe||pe||pr)?.message||'Não foi possível carregar os dados clínicos.');
  let selected=formId?forms.find(x=>x.id===formId):null;
  if(!selected)selected=forms[0];
  const patientOptions=(patients||[]).map(x=>({value:x.id,label:x.nome_completo}));
  const proOptions=(pros||[]).map(x=>({value:x.id,label:`${x.nome_completo}${x.registro_profissional?' · '+x.registro_profissional:''}`}));
  const formOptions=(forms||[]).map(x=>({value:x.id,label:x.nome}));
  const body=`<div class="space-y-5"><div class="grid md:grid-cols-3 gap-4">${selectField('paciente_id','Paciente',patientOptions,'',true)}${selectField('profissional_id','Profissional',proOptions,'',true)}${selectField('formulario_id','Formulário',formOptions,selected?.id||'',true)}</div><div class="card p-4 bg-slate-50"><label class="block"><span class="text-sm font-semibold">Agendamento (opcional)</span><select id="clinicalAgendamento" name="agendamento_id" class="mt-1 w-full border rounded-xl p-3"><option value="">Seleccionar depois…</option></select></label><p class="text-xs text-slate-400 mt-2">Os agendamentos são filtrados automaticamente quando o paciente for seleccionado.</p></div><div id="clinicalFormDynamic">${selected?renderClinicalFormSections(selected):'<div class="card p-5">Selecione um formulário.</div>'}</div><div class="grid md:grid-cols-2 gap-4">${textareaField('observacoes_profissional','Observações do profissional','',true)}${textareaField('conclusao','Conclusão','',true)}${textareaField('plano_seguimento','Plano de seguimento','',true)}</div></div>`;
  await modal('Nova avaliação clínica',body,async fd=>{
    const paciente_id=fd.get('paciente_id'), profissional_id=fd.get('profissional_id'), formulario_id=fd.get('formulario_id');
    if(!paciente_id||!profissional_id||!formulario_id)throw new Error('Paciente, profissional e formulário são obrigatórios.');
    const form=forms.find(x=>x.id===formulario_id); const answers=[];
    for(const sec of clinicalSchemaSections(form))for(const f of (sec.fields||[])){
      let val=f.type==='multiselect'?fd.getAll('cf_'+f.key):(f.type==='boolean'||f.type==='checkbox'?fd.get('cf_'+f.key)==='true':fd.get('cf_'+f.key));
      if(val===''||val===null||(Array.isArray(val)&&!val.length))continue;
      answers.push({campo_chave:f.key,valor_json:val});
    }
    const row={formulario_id,paciente_id,profissional_id,agendamento_id:fd.get('agendamento_id')||null,estado:'rascunho',data_avaliacao:new Date().toISOString(),observacoes_profissional:fd.get('observacoes_profissional')||null,conclusao:fd.get('conclusao')||null,plano_seguimento:fd.get('plano_seguimento')||null,versao:form.versao,criado_por:me.id};
    const {data:a,error}=await sb.from('ciadi_avaliacoes_clinicas').insert(row).select().single(); if(error)throw error;
    if(answers.length){const {error:e}=await sb.from('ciadi_avaliacoes_respostas').insert(answers.map(x=>({...x,avaliacao_id:a.id,preenchido_por:me.id})));if(e)throw e;}
    const {error:re}=await sb.from('ciadi_avaliacoes_resultados').insert({avaliacao_id:a.id,resultado_json:{},resumo_profissional:null,classificacao:null,criado_por:me.id});if(re)throw re;
    await audit('INSERT','ciadi_avaliacoes_clinicas',a.id,{formulario_id,paciente_id,profissional_id});toast('Avaliação guardada como rascunho.');clinicalEvaluationsList();
  });
  const p=document.querySelector('#ciadiModalForm select[name="paciente_id"]'), fs=document.querySelector('#ciadiModalForm select[name="formulario_id"]');
  const refreshAg=async()=>{const pid=p?.value, sel=document.getElementById('clinicalAgendamento');if(!sel||!pid)return;const {data}=await sb.from('agendamentos').select('id,data_hora,tipo,estado,profissionais(nome_completo),especialidades(nome)').eq('paciente_id',pid).order('data_hora',{ascending:false}).limit(30);sel.innerHTML='<option value="">Seleccionar…</option>'+(data||[]).map(x=>`<option value="${x.id}">${esc(new Date(x.data_hora).toLocaleString('pt-PT'))} · ${esc(x.profissionais?.nome_completo||'')} · ${esc(x.especialidades?.nome||'')} · ${esc(x.estado||'')}</option>`).join('');};
  p?.addEventListener('change',refreshAg);
  fs?.addEventListener('change',()=>{const f=forms.find(x=>x.id===fs.value);const d=document.getElementById('clinicalFormDynamic');if(d)d.innerHTML=f?renderClinicalFormSections(f):'';});
}

async function newDocument(){

function sectionError(title,error){
  const msg=String(error?.message||error||'Erro desconhecido');
  const clock=/JWT issued at future|JWT.*future/i.test(msg);
  tablePage(title,'Não foi possível carregar esta área.',`<div class="card p-6 border-red-200"><div class="text-red-600 font-semibold">${esc(msg)}</div>${clock?'<div class="mt-3 text-sm text-slate-600">A sessão JWT está fora de sincronia com o relógio. Sincronize a hora do Windows e entre novamente no CIADI.</div>':''}<div class="mt-4 flex gap-2"><button class="border rounded-xl px-4 py-2" onclick="go('${current}')">Tentar novamente</button>${clock?'<button class="bg-orange text-white rounded-xl px-4 py-2 font-bold" onclick="refreshAuthSession()">Renovar sessão</button>':''}</div></div>`);
}

async function newMedia(){
 await modal('Novo conteúdo multimédia',`<div class="rounded-2xl bg-orange-50 p-4 mb-5"><b>Upload directo do computador</b><p class="text-sm text-slate-600 mt-1">Seleccione uma imagem ou vídeo. O ficheiro será enviado para o bucket público <b>galeria</b> e registado automaticamente na galeria CIADI.</p></div><div class="grid md:grid-cols-2 gap-4">${inputField('titulo','Título','', 'text',true)}${inputField('categoria','Categoria','institucional')}${inputField('ordem','Ordem','0','number')}<label class="block md:col-span-2"><span class="text-sm font-semibold">Ficheiro do computador *</span><input name="ficheiro" type="file" required accept="image/*,video/*" class="mt-1 w-full border rounded-xl p-3"><span class="text-xs text-slate-400">Imagem ou vídeo. O sistema detecta automaticamente o tipo.</span></label>${textareaField('descricao','Descrição','',true)}<label class="flex items-center gap-2"><input type="checkbox" name="ativo" checked> Publicar no site</label></div>`,async fd=>{
   const file=fd.get('ficheiro');
   if(!(file instanceof File)||!file.size)throw new Error('Seleccione uma imagem ou vídeo do computador.');
   if(!file.type.startsWith('image/')&&!file.type.startsWith('video/'))throw new Error('Formato não suportado. Use imagem ou vídeo.');
   if(file.size>50*1024*1024)throw new Error('O ficheiro multimédia não pode ultrapassar 50 MB.');
   const tipo=file.type.startsWith('video/')?'video':'imagem';
   const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
   const path=`${Date.now()}-${safe}`;
   const up=await sb.storage.from('galeria').upload(path,file,{upsert:false,contentType:file.type});
   if(up.error)throw up.error;
   const pub=sb.storage.from('galeria').getPublicUrl(path);
   const url=pub?.data?.publicUrl;
   if(!url){await sb.storage.from('galeria').remove([path]);throw new Error('Não foi possível obter o endereço público do ficheiro.');}
   const row={titulo:fd.get('titulo'),descricao:fd.get('descricao')||null,tipo,arquivo_url:url,thumbnail_url:tipo==='imagem'?url:null,categoria:fd.get('categoria')||'institucional',ordem:Number(fd.get('ordem')||0),ativo:fd.get('ativo')==='on'};
   const {data,error}=await sb.from('galeria').insert(row).select().single();
   if(error){await sb.storage.from('galeria').remove([path]);throw error;}
   await audit('UPLOAD','galeria',data.id,{path,tipo,categoria:row.categoria});
   toast('Ficheiro carregado e registado na galeria CIADI.');
   multimedia();
 });

async function boot(){
  try{
    initSupabase();
    const {data,error}=await sb.auth.getSession();
    if(error) throw error;
    if(data?.session) await enter(data.session.user);
  }catch(e){
    console.error('CIADI boot',e);
    document.getElementById('loginMsg').textContent='Não foi possível iniciar o acesso: '+(e.message||e);
  }
}
async function enter(u){
  try{
    initSupabase();
    me=u;
    const q=await sb.from('perfis').select('id,email,nome_completo,nome_exibicao,tipo,ativo,telefone').eq('id',u.id).maybeSingle();
    if(q.error) throw new Error('Não foi possível validar o perfil administrativo: '+q.error.message);
    profile=q.data;
    if(!profile){ await sb.auth.signOut(); throw new Error('O utilizador autenticado não possui perfil em public.perfis.'); }
    if(profile.ativo!==true){ await sb.auth.signOut(); throw new Error('O perfil administrativo está inactivo.'); }
    if(!['admin','suporte','profissional','operador'].includes(profile.tipo)){ await sb.auth.signOut(); throw new Error('Este utilizador não possui acesso ao Dashboard administrativo.'); }
    document.getElementById('login').classList.add('hiddenx');
    document.getElementById('app').classList.remove('hiddenx');
    document.getElementById('who').textContent=`${profile.nome_exibicao||profile.nome_completo||u.email} · ${profile.tipo}`;
    nav(); await go(profile.tipo==='operador'?'sos':profile.tipo==='profissional'?'agendamentos':'overview');
  }catch(e){
    console.error('CIADI perfil',e);
    document.getElementById('login').classList.remove('hiddenx');
    document.getElementById('app').classList.add('hiddenx');
    document.getElementById('loginMsg').textContent=e.message||'Falha ao validar o acesso.';
  }
}
async function logout(){await sb.auth.signOut();location.reload()}
document.getElementById('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const m=document.getElementById('loginMsg');
  const emailEl=document.getElementById('email');
  const passwordEl=document.getElementById('password');
  const button=e.submitter||document.querySelector('#loginForm button');
  m.className='text-sm'; m.textContent='A autenticar…';
  if(button){button.disabled=true;button.textContent='A entrar…';}
  try{
    initSupabase();
    const email=emailEl.value.trim();
    const password=passwordEl.value;
    if(!email||!password) throw new Error('Introduza o e-mail e a palavra-passe.');
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error) throw error;
    if(!data?.user) throw new Error('O Supabase não devolveu um utilizador autenticado.');
    await enter(data.user);
  }catch(err){
    console.error('CIADI login',err);
    m.textContent=err.message||'Não foi possível entrar.';
  }finally{
    if(button){button.disabled=false;button.textContent='Entrar';}
  }
});
initSupabase();
sb.auth.onAuthStateChange((event,session)=>{
  if(event==='SIGNED_IN' && session?.user && document.getElementById('app').classList.contains('hiddenx')) enter(session.user);
  if(event==='SIGNED_OUT'){document.getElementById('app').classList.add('hiddenx');document.getElementById('login').classList.remove('hiddenx');}
});
boot();
</script></body></html>
