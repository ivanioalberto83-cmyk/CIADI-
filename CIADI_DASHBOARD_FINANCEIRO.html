async function acompanhantesAT(){
  if(!canAccessAT()){ document.getElementById('content').innerHTML='<div class="card p-6"><b>Acesso não autorizado.</b></div>'; return; }
  const isManager=canManageHR();
  const [patRes, prRes, atRes] = await Promise.all([
    sb.from('pacientes').select('id,nome_completo,data_nascimento').order('nome_completo'),
    sb.from('profissionais').select('id,nome_completo,registro_profissional,especialidade_id,eh_at,ativo,perfil_id').eq('ativo',true).order('nome_completo'),
    sb.from('ciadi_atribuicoes_at').select('id,profissional_id,paciente_id,agendamento_id,data_inicio,data_fim,ativo,permissoes,created_at').eq('ativo',true).order('created_at',{ascending:false})
  ]);
  if(patRes.error) throw patRes.error; if(prRes.error) throw prRes.error; if(atRes.error) throw atRes.error;
  const patients=patRes.data||[], pros=prRes.data||[], assignments=atRes.data||[];
  const myProf=pros.find(x=>x.perfil_id===me.id);
  const allowedAssignments=isManager?assignments:assignments.filter(a=>a.profissional_id===myProf?.id);
  const byP=Object.fromEntries(patients.map(x=>[x.id,x])); const byPr=Object.fromEntries(pros.map(x=>[x.id,x]));
  const atPros=pros.filter(x=>x.eh_at===true || x.perfil_id===me.id);
  document.getElementById('content').innerHTML=`
  <div class="card p-6 space-y-5">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
      <div><h2 class="text-2xl font-black">Acompanhantes Terapêuticos (A.T.)</h2><p class="text-slate-500">Atribuição controlada de A.T. a pacientes/crianças, com período e permissões.</p></div>
      ${isManager?'<button onclick="newATAssignment()" class="bg-orange text-white rounded-xl px-4 py-2 font-bold">+ Nova atribuição</button>':''}
    </div>
    ${!allowedAssignments.length?'<div class="border rounded-xl p-5 text-slate-500">Nenhuma atribuição ativa encontrada.</div>':`<div class="overflow-auto"><table class="w-full text-sm"><thead><tr class="text-left border-b"><th class="p-3">Paciente</th><th class="p-3">A.T.</th><th class="p-3">Início</th><th class="p-3">Fim</th><th class="p-3">Permissões</th><th class="p-3">Estado</th></tr></thead><tbody>${allowedAssignments.map(a=>{const p=byP[a.paciente_id]||{};const pr=byPr[a.profissional_id]||{};const perms=a.permissoes||{};return `<tr class="border-b"><td class="p-3 font-semibold">${esc(p.nome_completo||'—')}</td><td class="p-3">${esc(pr.nome_completo||'—')}<div class="text-xs text-slate-500">${esc(pr.registro_profissional||'')}</div></td><td class="p-3">${esc(a.data_inicio||'—')}</td><td class="p-3">${esc(a.data_fim||'Sem fim')}</td><td class="p-3">${Object.entries(perms).filter(([,v])=>v===true).map(([k])=>esc(k.replaceAll('_',' '))).join(', ')||'—'}</td><td class="p-3"><span class="px-2 py-1 rounded-full bg-emerald-50 text-emerald-700">Ativa</span></td></tr>`}).join('')}</tbody></table></div>`}
  </div>
  <div class="card p-6 mt-5">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3"><div><h3 class="text-xl font-black">Formulários A.T.</h3><p class="text-sm text-slate-500">Registo diário, comportamento/ABC, habilidades e incidentes.</p></div><div class="flex flex-wrap gap-2"><button onclick="openATForm('diario')" class="bg-orange text-white rounded-xl px-3 py-2 font-bold">+ Registo diário</button><button onclick="openATForm('comportamento')" class="border rounded-xl px-3 py-2 font-bold">+ Comportamento / ABC</button><button onclick="openATForm('habilidades')" class="border rounded-xl px-3 py-2 font-bold">+ Habilidades</button><button onclick="openATForm('incidente')" class="border rounded-xl px-3 py-2 font-bold">+ Incidente</button></div></div>
  </div>`;
}
async function newATAssignment(){
  if(!['admin','gestor'].includes(profile?.tipo)){toast('Apenas Admin/Gestor pode criar atribuições.');return;}
  const [pRes,prRes]=await Promise.all([sb.from('pacientes').select('id,nome_completo').order('nome_completo'),sb.from('profissionais').select('id,nome_completo,registro_profissional,eh_at,ativo').eq('ativo',true).order('nome_completo')]);
  if(pRes.error||prRes.error) throw (pRes.error||prRes.error);
  const patients=pRes.data||[], pros=prRes.data||[];
  if(!pros.length){toast('Não existem profissionais ativos cadastrados.');return;}
  const body=`<div class="space-y-3"><label class="block"><span class="text-sm font-semibold">Acompanhante Terapêutico (A.T.)</span><select id="at_prof" class="w-full border rounded-xl p-3">${pros.map(x=>`<option value="${x.id}">${esc(x.nome_completo)}${x.registro_profissional?' · '+esc(x.registro_profissional):''}</option>`).join('')}</select></label><label class="block"><span class="text-sm font-semibold">Paciente / criança</span><select id="at_pac" class="w-full border rounded-xl p-3">${patients.map(x=>`<option value="${x.id}">${esc(x.nome_completo)}</option>`).join('')}</select></label><div class="grid md:grid-cols-2 gap-3"><label>Início<input id="at_ini" type="date" value="${new Date().toISOString().slice(0,10)}" class="w-full border rounded-xl p-3"></label><label>Fim (opcional)<input id="at_fim" type="date" class="w-full border rounded-xl p-3"></label></div><div class="text-sm font-semibold">Permissões</div><div class="grid md:grid-cols-2 gap-2">${[['ver_agenda','Ver agenda'],['registar_acompanhamento','Registar acompanhamento'],['ver_plano','Ver plano terapêutico'],['ver_documentos_autorizados','Ver documentos autorizados']].map(([k,l])=>`<label class="border rounded-xl p-3 flex gap-2"><input id="perm_${k}" type="checkbox" checked> ${l}</label>`).join('')}</div><div class="flex justify-end gap-2"><button onclick="closeModal()" class="border rounded-xl px-4 py-2">Cancelar</button><button onclick="saveATAssignment()" class="bg-orange text-white rounded-xl px-4 py-2 font-bold">Guardar</button></div></div>`;
  openModal('Nova atribuição de A.T.',body);
}
async function ensureATProfessional(profissionalId){
  const q=await sb.from('profissionais').select('id,nome_completo,eh_at,ativo').eq('id',profissionalId).maybeSingle();
  if(q.error)throw q.error; if(!q.data?.ativo)throw new Error('O profissional seleccionado está inactivo.');
  if(!q.data.eh_at){const r=await sb.rpc('ciadi_at_selecionar_profissional',{p_profissional_id:profissionalId});if(r.error)throw r.error;}
  return q.data;
}
async function openATForm(tipo){
  if(!['admin','gestor'].includes(profile?.tipo) && !myOwnATAccess()) { toast('Acesso à área A.T. não autorizado.'); return; }
  const [pRes,prRes]=await Promise.all([sb.from('pacientes').select('id,nome_completo').eq('ativo',true).order('nome_completo'),

  if(pRes.error||prRes.error)throw(pRes.error||prRes.error);
  const patients=pRes.data||[],pros=prRes.data||[];
  if(!patients.length){toast('Cadastre primeiro um paciente ativo.');return;}
  const title={diario:'Novo Registo Diário A.T.',comportamento:'Novo Registo de Comportamento / ABC',habilidades:'Novo Registo de Habilidades',incidente:'Novo Incidente A.T.'}[tipo];
  let extra='';

      const id=String(r.id||'').slice(0,8);
      return '<article class="border rounded-2xl p-4 bg-white"><div class="flex flex-wrap items-start justify-between gap-3"><div><div class="font-black text-lg">'+esc(r.protocolo||('SOS-'+id))+'</div><div class="text-sm text-slate-500">'+esc(when?new Date(when).toLocaleString('pt-PT'):'Data não disponível')+'</div></div><div class="flex gap-2 flex-wrap"><span class="rounded-full px-3 py-1 text-xs font-bold '+badge+'">'+esc(level)+'</span><span class="rounded-full px-3 py-1 text-xs font-bold bg-slate-100 text-slate-700">'+esc(r.estado||'aberto')+'</span></div></div><div class="grid md:grid-cols-2 gap-3 mt-3 text-sm"><div><span class="text-slate-500">Assistido:</span> <b>'+esc(patients[r.paciente_id]||'Registo associado')+'</b></div><div><span class="text-slate-500">Categoria:</span> <b>'+esc(r.categoria||r.tipo||'SOS')+'</b></div></div><p class="mt-3 whitespace-pre-wrap">'+esc(r.mensagem||r.descricao||'Sem mensagem adicional.')+'</p>'+(hasLocation?'<p class="mt-3"><a class="text-orange underline font-semibold" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps?q='+encodeURIComponent(lat+','+lon)+'">Abrir localização autorizada no mapa</a></p>':'')+'</article>';

    catch(e){console.warn('CIADI SOS Realtime não disponível:',e);}
  }

async function modal(title,body,onSave,saveText='Guardar'){
  const old=document.getElementById('ciadiModal'); if(old) old.remove();
  const wrap=document.createElement('div'); wrap.id='ciadiModal'; wrap.className='fixed inset-0 z-[100] bg-black/40 flex items-center justify-center p-4';
  wrap.innerHTML=`<div class="bg-white w-full max-w-4xl max-h-[92vh] overflow-auto rounded-3xl shadow-2xl"><div class="sticky top-0 bg-white border-b px-6 py-4 flex justify-between items-center"><div><h3 class="text-xl font-black">${esc(title)}</h3><p class="text-xs text-slate-500">Campos com * são obrigatórios.</p></div><button type="button" class="text-2xl" onclick="closeModal()">×</button></div><form id="ciadiModalForm" class="p-6">${body}<div class="flex justify-end gap-3 mt-6"><button type="button" class="border rounded-xl px-5 py-3" onclick="closeModal()">Cancelar</button><button class="bg-orange text-white rounded-xl px-5 py-3 font-bold">${esc(saveText)}</button></div></form></div>`;
  document.body.appendChild(wrap);
  document.getElementById('ciadiModalForm').addEventListener('submit',async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;b.textContent='A guardar…';try{await onSave(new FormData(e.currentTarget));closeModal();}catch(err){toast(err?.message||'Não foi possível guardar.');}finally{b.disabled=false;b.textContent=saveText;}});
}
function openModal(title,body){const old=document.getElementById('ciadiModal');if(old)old.remove();const wrap=document.createElement('div');wrap.id='ciadiModal';wrap.className='fixed inset-0 z-[100] bg-black/40 flex items-center justify-center p-4';wrap.innerHTML=`<div class="bg-white w-full max-w-3xl max-h-[92vh] overflow-auto rounded-3xl shadow-2xl"><div class="sticky top-0 bg-white border-b px-6 py-4 flex justify-between items-center"><h3 class="text-xl font-black">${esc(title)}</h3><button type="button" class="text-2xl" onclick="closeModal()">×</button></div><div class="p-6">${body}</div></div>`;document.body.appendChild(wrap)}
function closeModal(){document.getElementById('ciadiModal')?.remove()}
function inputField(name,label,value='',type='text',required=false,extra=''){return `<label class="block"><span class="text-sm font-semibold">${esc(label)}${required?' *':''}</span><input name="${esc(name)}" type="${type}" value="${esc(value)}" ${required?'required':''} class="mt-1 w-full border rounded-xl p-3" ${extra}></label>`}
function selectField(name,label,options,value='',required=false){return `<label class="block"><span class="text-sm font-semibold">${esc(label)}${required?' *':''}</span><select name="${esc(name)}" ${required?'required':''} class="mt-1 w-full border rounded-xl p-3"><option value="">Seleccionar…</option>${options.map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(value)?'selected':''}>${esc(o.label)}</option>`).join('')}</select></label>`}
function textareaField(name,label,value='',full=false){return `<label class="block ${full?'md:col-span-2':''}"><span class="text-sm font-semibold">${esc(label)}</span><textarea name="${esc(name)}" rows="3" class="mt-1 w-full border rounded-xl p-3">${esc(value)}</textarea></label>`}
function toLocalInput(iso){if(!iso)return '';const d=new Date(iso);const pad=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`}
function dashboardRoomLink(id){const base=window.location.href.split('#')[0].split('?')[0];return base.substring(0,base.lastIndexOf('/')+1)+'sala.html?agendamento_id='+encodeURIComponent(id)}

function invoiceTypeLabel(t){return ({FT:'Fatura',FR:'Fatura-Recibo',NC:'Nota de Crédito',ND:'Nota de Débito',RC:'Recibo'}[t]||t||'Documento')}
function invoiceClientCode(id){const raw=String(id||'').replace(/-/g,'').toUpperCase();return raw?'CLI-'+raw.slice(0,8):'A atribuir';}
function invoiceIsAdjustment(t){return ['NC','ND'].includes(t)}
function invoiceIsReceipt(t){return t==='RC'}
function invoiceDateValue(){return new Date().toISOString().slice(0,10)}
function invoiceNumberPreview(type,series,seq){return `${type||'FT'} ${series||'—'}/${seq||'—'}`}
function calcInvoiceLine(qty,price,rate,discount){const base=Math.max(0,Number(qty||0)*Number(price||0)-Number(discount||0));const tax=Math.round(base*Number(rate||0)/100*100)/100;return {base,tax,total:Math.round((base+tax)*100)/100}}
function updateA4Generator(){
  const f=document.getElementById('a4Generator'); if(!f)return;
  const type=f.querySelector('[name="tipo_documento"]')?.value||'FT';
  const series=f.querySelector('[name="serie_id"]'); const selectedSeries=series?.options[series.selectedIndex];
  const seq=selectedSeries?.dataset.seq||'—'; const code=selectedSeries?.dataset.code||'—';
  const qty=Number(f.querySelector('[name="quantidade"]')?.value||1),price=Number(f.querySelector('[name="preco_unitario"]')?.value||0),rate=Number(f.querySelector('[name="taxa_imposto"]')?.value||0),disc=Number(f.querySelector('[name="desconto"]')?.value||0);
  const line=calcInvoiceLine(qty,price,rate,disc); const total=line.total;
  const patient=f.querySelector('[name="paciente_id"]'); const customer=f.querySelector('[name="cliente_id"]'); const responsible=f.querySelector('[name="responsavel_id"]'); const customerOpt=customer?.options[customer.selectedIndex]; const responsibleOpt=responsible?.options[responsible.selectedIndex]; const pn=customerOpt?.dataset?.name||responsibleOpt?.dataset?.name||'Cliente não selecionado'; const nif=customerOpt?.dataset?.nif||''; const address=customerOpt?.dataset?.address||responsibleOpt?.dataset?.address||''; const clientNo=customerOpt?.value?invoiceClientCode(customerOpt.value):(responsibleOpt?.value?'A atribuir ao responsável':'A atribuir');
  const desc=f.querySelector('[name="descricao"]')?.value||'Serviço clínico CIADI';
  const payment=f.querySelector('[name="forma_pagamento"]')?.value||'';
  const operation=f.querySelector('[name="data_operacao"]')?.value||invoiceDateValue();
  const due=f.querySelector('[name="data_vencimento"]')?.value||'';
  const origin=f.querySelector('[name="documento_origem_id"]'); const on=origin?.options[origin.selectedIndex]?.textContent||'';
  const el=document.getElementById('a4LivePreview');
  if(!el)return;
  el.innerHTML=buildInvoiceA4Html({emitente:window.ciadiA4Emitter||{},type,code,seq,pn,nif,address,clientNo,desc,qty,price,rate,disc,line,payment,operation,due,origin:on,preview:true});
  const summary=document.getElementById('a4Summary'); if(summary)summary.innerHTML=`<div>Base <b>${money(line.base)}</b></div><div>Imposto <b>${money(line.tax)}</b></div><div class="text-lg">Total <b>${money(total)}</b></div>`;
  const originWrap=document.getElementById('originWrap'); if(originWrap)originWrap.classList.toggle('hidden',!invoiceIsAdjustment(type));
}

      sb.from('finance_clientes').select('id,nome,nome_comercial,nif,endereco,endereco_faturacao,municipio,provincia,email,telefone,ativo,tipo_adquirente,tipo').eq('ativo',true).order('nome'),
      sb.from('finance_series').select('id,codigo,nome,tipo_documento,proximo_numero,ativa,estado').eq('ativa',true).order('codigo'),
      sb.from('finance_servicos').select('id,codigo,nome,preco_base,taxa_imposto').eq('ativo',true).order('nome'),
      sb.from('finance_documentos').select('id,document_no,tipo_documento,total').not('document_status','eq','anulado').order('data_emissao',{ascending:false}).limit(300),
      sb.from('finance_emitente_config').select('*').eq('ativo',true).order('updated_at',{ascending:false}).limit(1).maybeSingle(),

      sb.from('perfis').select('id,nome_completo,nome_exibicao,email,telefone,ativo').eq('ativo',true)

  }catch(e){toast(e?.message||'Não foi possível guardar o rascunho.')}
}

async function receiveFinanceDocument(documentId){
  try{
    const [{data:d,error:de},{data:cash,error:ce}]=await Promise.all([
      sb.from('finance_documentos').select('id,document_no,total,estado_pagamento,fiscal_status,empresa_id').eq('id',documentId).single(),
      sb.from('finance_caixas').select('id,nome,estado,empresa_id').eq('estado','aberto').order('created_at',{ascending:false})
    ]);
    if(de)throw de;if(ce)throw ce;
    if(!d)throw new Error('Documento não encontrado.');
    if(d.fiscal_status!=='emitido')throw new Error('Só é possível receber um documento emitido.');
    const {data:paid,error:pe}=await sb.from('finance_pagamentos').select('valor').eq('documento_id',documentId);
    if(pe)throw pe;
    const recebido=(paid||[]).reduce((a,x)=>a+Number(x.valor||0),0);
    const saldo=Math.max(0,Number(d.total||0)-recebido);
    if(saldo<=0){toast('Este documento já está liquidado.');return;}
    const body=`<div class="space-y-4"><div class="rounded-xl bg-slate-50 p-4"><b>${esc(d.document_no)}</b><div class="text-sm text-slate-500 mt-1">Total: ${money(d.total)} · Já recebido: ${money(recebido)} · <b>Saldo: ${money(saldo)}</b></div></div><div class="grid md:grid-cols-2 gap-4">${inputField('valor','Valor a receber',saldo,'number',true,'min="0.01" max="'+saldo.toFixed(2)+'" step="0.01"')}${selectField('metodo','Método de pagamento',[{value:'numerario',label:'Numerário'},{value:'tpa',label:'TPA'},{value:'transferencia',label:'Transferência'},{value:'multicaixa',label:'Multicaixa'},{value:'referencia',label:'Referência'},{value:'outro',label:'Outro'}],'',true)}${inputField('referencia','Referência','')}${selectField('caixa_id','Caixa aberto',(cash||[]).filter(x=>!x.empresa_id||x.empresa_id===d.empresa_id).map(x=>({value:x.id,label:x.nome})), '')}${textareaField('observacoes','Observações','')}</div></div>`;
    await modal('Receber pagamento / emitir recibo',body,async fd=>{
      const valor=Number(fd.get('valor')||0),metodo=fd.get('metodo'),caixaId=fd.get('caixa_id')||null;
      if(valor<=0||valor>saldo+0.001)throw new Error('Valor de pagamento inválido.');
      const {data:r,error}=await sb.rpc('finance_registar_pagamento',{p_documento_id:documentId,p_valor:valor,p_metodo:metodo,p_referencia:fd.get('referencia')||null,p_caixa_id:caixaId,p_observacoes:fd.get('observacoes')||null});
      if(error)throw error;
      const row=Array.isArray(r)?r[0]:r;
      if(!row?.pagamento_id)throw new Error('Pagamento registado sem identificador.');
      const integ=await sb.rpc('ciadi_finance_integrar_pagamento',{p_pagamento_id:row.pagamento_id,p_caixa_id:caixaId});
      if(integ.error)throw integ.error;
      await audit('RECEBER_PAGAMENTO','finance_pagamentos',row.pagamento_id,{documento_id:documentId,valor,metodo,recibo_id:row.recibo_id,recibo_no:row.recibo_no,integracao:integ.data});
      toast(`Pagamento registado · Recibo ${row.recibo_no||''}`);closeModal();financeInvoices();
      if(row.recibo_id)setTimeout(()=>previewFinanceInvoice(row.recibo_id),150);
    });
  }catch(e){toast(e?.message||'Não foi possível registar o pagamento.')}
}

async function newExpense(){
  try{
    const {data:registry,error:re}=await sb.from('finance_clientes').select('id,nome,nome_comercial,nif,ativo,tipo_adquirente,tipo').eq('ativo',true).order('nome');
    if(re)throw re;
    const suppliers=(registry||[]).filter(r=>String(r.tipo_adquirente||r.tipo||'').toLowerCase()==='fornecedor');
    const {data:companies,error:ce}=await sb.from('finance_empresas').select('id,razao_social').eq('ativo',true).eq('empresa_principal',true).maybeSingle();
    if(ce)throw ce;
    if(!companies?.id)throw new Error('Configure a empresa principal em Empresas & Emitente antes de registar compras/despesas.');
    const workflowReady=await detectExpenseWorkflowSchema();
    await modal('Nova despesa / compra',`<div class="grid md:grid-cols-2 gap-4">${selectField('fornecedor_id','Fornecedor do cadastro comercial',suppliers.map(x=>({value:x.id,label:(x.nome_comercial||x.nome)+' · NIF '+(x.nif||'—')})),'',false)}${inputField('fornecedor_nome','Fornecedor (preencher se não estiver cadastrado)','','text',false)}${inputField('fornecedor_nif','NIF do fornecedor')}${inputField('descricao','Descrição','','text',true)}${inputField('documento_referencia','N.º documento')}${inputField('data_documento','Data',new Date().toISOString().slice(0,10),'date',true)}${inputField('data_vencimento','Vencimento','','date')}${inputField('total','Total','0','number',true,'min="0" step="0.01"')}${inputField('categoria','Categoria')}${inputField('conta_contabil','Conta contabilística')}${inputField('centro_custo','Centro de custo')}${textareaField('observacoes','Observações','',true)}</div><div class="rounded-xl bg-amber-50 text-amber-900 p-3 text-xs mt-3">${workflowReady?'A associação do fornecedor por identificador está disponível; a aprovação e contabilização dependem de permissões e funções validadas.':'O esquema atual de finance_despesas não disponibiliza fornecedor_id. O fornecedor será guardado como nome e NIF; a aprovação e contabilização ficam bloqueadas até validação e aplicação da migração.'} A despesa começa pendente e não é contabilizada automaticamente.</div>`,async fd=>{
      const selected=suppliers.find(x=>x.id===fd.get('fornecedor_id'));
      const nome=(selected?.nome_comercial||selected?.nome||fd.get('fornecedor_nome')||'').trim();
      if(!nome)throw new Error('Selecione um fornecedor ou preencha o nome.');
      const total=Number(fd.get('total')||0);
      if(!(total>0))throw new Error('O total deve ser superior a zero.');
      const row={empresa_id:companies.id,fornecedor_nome:nome,fornecedor_nif:selected?.nif||((fd.get('fornecedor_nif')||'').trim()||null),descricao:fd.get('descricao'),documento_referencia:fd.get('documento_referencia')||null,data_documento:fd.get('data_documento'),data_vencimento:fd.get('data_vencimento')||null,total,valor:total,imposto:0,estado:'pendente',categoria:fd.get('categoria')||null,conta_contabil:fd.get('conta_contabil')||null,centro_custo:fd.get('centro_custo')||null,observacoes:fd.get('observacoes')||null,criado_por:me.id};
      if(workflowReady){
        row.fornecedor_id=selected?.id||null;
        row.aprovacao_estado='pendente';
        row.contabilizacao_estado='pendente';
      }
      const {data,error}=await sb.from('finance_despesas').insert(row).select().single();
      if(error)throw error;
      await audit('INSERT','finance_despesas',data.id,{fornecedor_nome:row.fornecedor_nome,fornecedor_nif:row.fornecedor_nif,total:row.total,empresa_id:row.empresa_id});
      toast('Despesa registada para revisão. Ainda não contabilizada.');
      closeModal();financeExpenses();
    });
  }catch(e){toast(e?.message||'Não foi possível abrir o registo de despesa.')}
}
async function approveExpense(expenseId,approve){
  try{
    const {data,error}=await sb.rpc('finance_aprovar_despesa',{p_despesa_id:expenseId,p_aprovar:approve});
    if(error)throw error;
    await audit(approve?'APROVAR_DESPESA':'REJEITAR_DESPESA','finance_despesas',expenseId,data||{});
    toast(approve?'Despesa aprovada.':'Despesa rejeitada.');
    if(current==='aprovisionamento')return ciadiProcurement();
    return financeExpenses();
  }catch(e){toast(e?.message||'Não foi possível atualizar a aprovação.')}
}
async function postExpense(expenseId){
  try{
    const {data,error}=await sb.rpc('finance_postar_despesa',{p_despesa_id:expenseId});
    if(error)throw error;
    await audit('CONTABILIZAR_DESPESA','finance_despesas',expenseId,{lancamento_id:data});
    toast('Despesa contabilizada com sucesso.');
    if(current==='aprovisionamento')return ciadiProcurement();
    return financeExpenses();

async function selectProfessionalAsAT(id,alreadyAT){

  const check=await sb.from('profissionais').select('id,nome_completo,registro_profissional,ativo').eq('id',id).maybeSingle();
  if(check.error){toast(check.error.message);return;}
  const professional=check.data;
  if(!professional?.ativo){toast('Este profissional está inactivo e não pode ser adicionado como A.T.');return;}
  if(!confirm(`Adicionar ${professional.nome_completo} como Acompanhante Terapêutico (A.T.)?`))return;
  const {data,error}=await sb.rpc('ciadi_at_selecionar_profissional',{p_profissional_id:id});
  if(error){toast(error.message);return;}
  await audit('TORNAR_AT','profissionais',id,data?.[0]||{profissional_id:id,nome_completo:professional.nome_completo});
  toast(`${professional.nome_completo} foi ligado à área de Acompanhante Terapêutico.`);
  await professionals();
}

function clinicalSchemaSections(form){const s=form?.schema_json||{};return Array.isArray(s.sections)?s.sections:[{title:'Campos',fields:Array.isArray(s.fields)?s.fields:[]}];}
function clinicalFieldValue(id){const e=document.getElementById(id);return e?.value??'';}
function renderClinicalField(f){
  const name=esc(f.key), label=esc(f.label||f.key), req=f.required?'required':'';
  const help=f.help?`<div class="text-xs text-slate-400 mt-1">${esc(f.help)}</div>`:'';
  if(f.type==='textarea')return `<label class="block"><span class="text-sm font-semibold">${label}${f.required?' *':''}</span><textarea name="cf_${name}" ${req} rows="4" class="mt-1 w-full border rounded-xl p-3" placeholder="${esc(f.placeholder||'')}"></textarea>${help}</label>`;
  if(f.type==='select'||f.type==='radio'){const opts=(f.options||[]).map(o=>typeof o==='object'?o:{value:o,label:o});return `<label class="block"><span class="text-sm font-semibold">${label}${f.required?' *':''}</span><select name="cf_${name}" ${req} class="mt-1 w-full border rounded-xl p-3"><option value="">Seleccionar…</option>${opts.map(o=>`<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('')}</select>${help}</label>`;}
  if(f.type==='multiselect'){const opts=(f.options||[]).map(o=>typeof o==='object'?o:{value:o,label:o});return `<fieldset class="border rounded-xl p-3"><legend class="text-sm font-semibold px-1">${label}${f.required?' *':''}</legend><div class="grid md:grid-cols-2 gap-2">${opts.map(o=>`<label class="flex gap-2 items-center"><input type="checkbox" name="cf_${name}" value="${esc(o.value)}">${esc(o.label)}</label>`).join('')}</div>${help}</fieldset>`;}
  if(f.type==='boolean'||f.type==='checkbox')return `<label class="flex gap-2 items-center border rounded-xl p-3"><input type="checkbox" name="cf_${name}" value="true"> <span class="text-sm font-semibold">${label}</span></label>`;
  if(f.type==='number'||f.type==='date'||f.type==='datetime')return `<label class="block"><span class="text-sm font-semibold">${label}${f.required?' *':''}</span><input name="cf_${name}" type="${f.type==='datetime'?'datetime-local':f.type}" ${req} class="mt-1 w-full border rounded-xl p-3" placeholder="${esc(f.placeholder||'')}">${help}</label>`;
  return `<label class="block"><span class="text-sm font-semibold">${label}${f.required?' *':''}</span><input name="cf_${name}" type="text" ${req} class="mt-1 w-full border rounded-xl p-3" placeholder="${esc(f.placeholder||'')}">${help}</label>`;
}
function renderClinicalFormSections(form){return clinicalSchemaSections(form).map(sec=>`<section class="card p-5"><h3 class="font-black text-lg">${esc(sec.title||'Secção')}</h3>${sec.description?`<p class="text-sm text-slate-500 mt-1">${esc(sec.description)}</p>`:''}<div class="grid md:grid-cols-2 gap-4 mt-4">${(sec.fields||[]).map(renderClinicalField).join('')}</div></section>`).join('');}

async function newClinicalEvaluation(formId=''){
  const [{data:forms,error:fe},{data:patients,error:pe},{data:pros,error:pr}]=await Promise.all([
    sb.from('ciadi_formularios_clinicos').select('*').eq('ativo',true).eq('publicado',true).order('nome'),
    sb.from('pacientes').select('id,nome_completo,data_nascimento,ativo').eq('ativo',true).order('nome_completo'),
    sb.from('profissionais').select('id,nome_completo,registro_profissional,especialidade_id,ativo').eq('ativo',true).order('nome_completo')
  ]);
  if(fe||pe||pr)return toast((fe||pe||pr)?.message||'Não foi possível carregar os dados clínicos.');
  let selected=formId?forms.find(x=>x.id===formId):null;
  if(!selected)selected=forms[0];
  const patientOptions=(patients||[]).map(x=>({value:x.id,label:x.nome_completo}));
  const proOptions=(pros||[]).map(x=>({value:x.id,label:`${x.nome_completo}${x.registro_profissional?' · '+x.registro_profissional:''}`}));
  const formOptions=(forms||[]).map(x=>({value:x.id,label:x.nome}));
  const body=`<div class="space-y-5"><div class="grid md:grid-cols-3 gap-4">${selectField('paciente_id','Paciente',patientOptions,'',true)}${selectField('profissional_id','Profissional',proOptions,'',true)}${selectField('formulario_id','Formulário',formOptions,selected?.id||'',true)}</div><div class="card p-4 bg-slate-50"><label class="block"><span class="text-sm font-semibold">Agendamento (opcional)</span><select id="clinicalAgendamento" name="agendamento_id" class="mt-1 w-full border rounded-xl p-3"><option value="">Seleccionar depois…</option></select></label><p class="text-xs text-slate-400 mt-2">Os agendamentos são filtrados automaticamente quando o paciente for seleccionado.</p></div><div id="clinicalFormDynamic">${selected?renderClinicalFormSections(selected):'<div class="card p-5">Selecione um formulário.</div>'}</div><div class="grid md:grid-cols-2 gap-4">${textareaField('observacoes_profissional','Observações do profissional','',true)}${textareaField('conclusao','Conclusão','',true)}${textareaField('plano_seguimento','Plano de seguimento','',true)}</div></div>`;
  await modal('Nova avaliação clínica',body,async fd=>{
    const paciente_id=fd.get('paciente_id'), profissional_id=fd.get('profissional_id'), formulario_id=fd.get('formulario_id');
    if(!paciente_id||!profissional_id||!formulario_id)throw new Error('Paciente, profissional e formulário são obrigatórios.');
    const form=forms.find(x=>x.id===formulario_id); const answers=[];
    for(const sec of clinicalSchemaSections(form))for(const f of (sec.fields||[])){
      let val=f.type==='multiselect'?fd.getAll('cf_'+f.key):(f.type==='boolean'||f.type==='checkbox'?fd.get('cf_'+f.key)==='true':fd.get('cf_'+f.key));
      if(val===''||val===null||(Array.isArray(val)&&!val.length))continue;
      answers.push({campo_chave:f.key,valor_json:val});
    }
    const row={formulario_id,paciente_id,profissional_id,agendamento_id:fd.get('agendamento_id')||null,estado:'rascunho',data_avaliacao:new Date().toISOString(),observacoes_profissional:fd.get('observacoes_profissional')||null,conclusao:fd.get('conclusao')||null,plano_seguimento:fd.get('plano_seguimento')||null,versao:form.versao,criado_por:me.id};
    const {data:a,error}=await sb.from('ciadi_avaliacoes_clinicas').insert(row).select().single(); if(error)throw error;
    if(answers.length){const {error:e}=await sb.from('ciadi_avaliacoes_respostas').insert(answers.map(x=>({...x,avaliacao_id:a.id,preenchido_por:me.id})));if(e)throw e;}
    const {error:re}=await sb.from('ciadi_avaliacoes_resultados').insert({avaliacao_id:a.id,resultado_json:{},resumo_profissional:null,classificacao:null,criado_por:me.id});if(re)throw re;
    await audit('INSERT','ciadi_avaliacoes_clinicas',a.id,{formulario_id,paciente_id,profissional_id});toast('Avaliação guardada como rascunho.');clinicalEvaluationsList();
  });
  const p=document.querySelector('#ciadiModalForm select[name="paciente_id"]'), fs=document.querySelector('#ciadiModalForm select[name="formulario_id"]');
  const refreshAg=async()=>{const pid=p?.value, sel=document.getElementById('clinicalAgendamento');if(!sel||!pid)return;const {data}=await sb.from('agendamentos').select('id,data_hora,tipo,estado,profissionais(nome_completo),especialidades(nome)').eq('paciente_id',pid).order('data_hora',{ascending:false}).limit(30);sel.innerHTML='<option value="">Seleccionar…</option>'+(data||[]).map(x=>`<option value="${x.id}">${esc(new Date(x.data_hora).toLocaleString('pt-PT'))} · ${esc(x.profissionais?.nome_completo||'')} · ${esc(x.especialidades?.nome||'')} · ${esc(x.estado||'')}</option>`).join('');};
  p?.addEventListener('change',refreshAg);
  fs?.addEventListener('change',()=>{const f=forms.find(x=>x.id===fs.value);const d=document.getElementById('clinicalFormDynamic');if(d)d.innerHTML=f?renderClinicalFormSections(f):'';});
}

function sectionError(title,error){
  const msg=String(error?.message||error||'Erro desconhecido');
  const clock=/JWT issued at future|JWT.*future/i.test(msg);
  tablePage(title,'Não foi possível carregar esta área.',`<div class="card p-6 border-red-200"><div class="text-red-600 font-semibold">${esc(msg)}</div>${clock?'<div class="mt-3 text-sm text-slate-600">A sessão JWT está fora de sincronia com o relógio. Sincronize a hora do Windows e entre novamente no CIADI.</div>':''}<div class="mt-4 flex gap-2"><button class="border rounded-xl px-4 py-2" onclick="go('${current}')">Tentar novamente</button>${clock?'<button class="bg-orange text-white rounded-xl px-4 py-2 font-bold" onclick="refreshAuthSession()">Renovar sessão</button>':''}</div></div>`);
}

async function newMedia(){
 await modal('Novo conteúdo multimédia',`<div class="rounded-2xl bg-orange-50 p-4 mb-5"><b>Upload directo do computador</b><p class="text-sm text-slate-600 mt-1">Seleccione uma imagem ou vídeo. O ficheiro será enviado para o bucket público <b>galeria</b> e registado automaticamente na galeria CIADI.</p></div><div class="grid md:grid-cols-2 gap-4">${inputField('titulo','Título','', 'text',true)}${inputField('categoria','Categoria','institucional')}${inputField('ordem','Ordem','0','number')}<label class="block md:col-span-2"><span class="text-sm font-semibold">Ficheiro do computador *</span><input name="ficheiro" type="file" required accept="image/*,video/*" class="mt-1 w-full border rounded-xl p-3"><span class="text-xs text-slate-400">Imagem ou vídeo. O sistema detecta automaticamente o tipo.</span></label>${textareaField('descricao','Descrição','',true)}<label class="flex items-center gap-2"><input type="checkbox" name="ativo" checked> Publicar no site</label></div>`,async fd=>{
   const file=fd.get('ficheiro');
   if(!(file instanceof File)||!file.size)throw new Error('Seleccione uma imagem ou vídeo do computador.');
   if(!file.type.startsWith('image/')&&!file.type.startsWith('video/'))throw new Error('Formato não suportado. Use imagem ou vídeo.');
   if(file.size>50*1024*1024)throw new Error('O ficheiro multimédia não pode ultrapassar 50 MB.');
   const tipo=file.type.startsWith('video/')?'video':'imagem';
   const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
   const path=`${Date.now()}-${safe}`;
   const up=await sb.storage.from('galeria').upload(path,file,{upsert:false,contentType:file.type});
   if(up.error)throw up.error;
   const pub=sb.storage.from('galeria').getPublicUrl(path);
   const url=pub?.data?.publicUrl;
   if(!url){await sb.storage.from('galeria').remove([path]);throw new Error('Não foi possível obter o endereço público do ficheiro.');}
   const row={titulo:fd.get('titulo'),descricao:fd.get('descricao')||null,tipo,arquivo_url:url,thumbnail_url:tipo==='imagem'?url:null,categoria:fd.get('categoria')||'institucional',ordem:Number(fd.get('ordem')||0),ativo:fd.get('ativo')==='on'};
   const {data,error}=await sb.from('galeria').insert(row).select().single();
   if(error){await sb.storage.from('galeria').remove([path]);throw error;}
   await audit('UPLOAD','galeria',data.id,{path,tipo,categoria:row.categoria});
   toast('Ficheiro carregado e registado na galeria CIADI.');
   multimedia();
 });
}

async function ciadiPoloAccess(){
  if(String(profile?.tipo||'').trim().toLowerCase()!=='admin'){
    document.getElementById('content').innerHTML='<div class="card p-6"><b>Acesso reservado ao Administrador do CIADI.</b><p class="text-sm text-slate-500 mt-2">A configuração dos acessos aos polos não é feita pelo instalador nem por utilizadores comuns.</p></div>';return;
  }
  try{
    const [pr,cc,ar]=await Promise.all([
      sb.from('perfis').select('id,nome_completo,email,tipo,ativo').order('nome_completo'),
      sb.from('finance_centros_custo').select('id,codigo,nome,ativo').eq('ativo',true).order('nome'),
      sb.from('ciadi_centros_acesso').select('id,perfil_id,centro_custo_id,ativo,principal,created_at').order('created_at',{ascending:false})
    ]);
    for(const x of [pr,cc,ar])if(x.error){
      if(x.error.code==='PGRST205'||x.error.code==='42P01'||/ciadi_centros_acesso/i.test(x.error.message||'')){
        tablePage('Polos e acessos','Atribuição explícita de utilizadores aos polos CIADI.',`<div class="rounded-xl border border-amber-300 bg-amber-50 text-amber-900 p-5"><b>Estrutura de acessos ainda não aplicada.</b><p class="mt-2 text-sm">A migração de associações por polo está preparada no ramo de homologação, mas não foi aplicada à base de dados. Esta página não cria permissões locais nem altera RLS automaticamente.</p></div>`);return;
      }
      throw x.error;
    }
    const users=pr.data||[],centres=cc.data||[],assignments=ar.data||[];
    const byUser=Object.fromEntries(users.map(x=>[x.id,x])),byCentre=Object.fromEntries(centres.map(x=>[x.id,x]));
    tablePage('Polos e acessos','Atribua a cada conta os polos autorizados. A seleção do polo predefinido no computador não concede permissões. O isolamento de cada módulo depende também das políticas RLS e das associações operacionais homologadas.',`
      <div class="flex flex-wrap justify-end gap-2 mb-4"><button onclick="newPoloAccess()" class="bg-orange text-white rounded-xl px-4 py-2 font-bold">+ Atribuir acesso a polo</button></div>
      <div class="grid sm:grid-cols-3 gap-3 mb-4"><div class="card p-4"><div class="text-sm text-slate-500">Contas</div><div class="text-2xl font-black">${users.length}</div></div><div class="card p-4"><div class="text-sm text-slate-500">Polos ativos</div><div class="text-2xl font-black">${centres.length}</div></div><div class="card p-4"><div class="text-sm text-slate-500">Atribuições ativas</div><div class="text-2xl font-black">${assignments.filter(x=>x.ativo).length}</div></div></div>
      <div class="card overflow-auto"><table class="w-full text-sm"><thead><tr class="border-b text-left"><th class="p-3">Utilizador</th><th>Perfil</th><th>Polo autorizado</th><th>Estado</th><th>Acção</th></tr></thead><tbody>${assignments.map(a=>'<tr class="border-b"><td class="p-3">'+esc(byUser[a.perfil_id]?.nome_completo||byUser[a.perfil_id]?.email||a.perfil_id)+'</td><td>'+esc(byUser[a.perfil_id]?.tipo||'—')+'</td><td>'+esc(byCentre[a.centro_custo_id]?.nome||a.centro_custo_id)+'</td><td>'+esc(a.ativo?'Ativo':'Revogado')+(a.principal?' · Predefinido':'')+'</td><td>'+(a.ativo?'<button class="border rounded px-2 py-1" onclick="setPoloAccessState(\''+a.id+'\',false)">Revogar</button>':'—')+'</td></tr>').join('')||'<tr><td colspan="5" class="p-4 text-slate-500">Ainda não existem atribuições por polo.</td></tr>'}</tbody></table></div>
      <div class="rounded-xl border p-4 mt-4 text-sm"><b>Importante:</b> estas atribuições são a base para o controlo por polo, mas não substituem a auditoria e atualização das políticas RLS das tabelas operacionais. Não se deve declarar isolamento completo até testar acessos diretos a cada módulo.</div>
    `);
  }catch(e){sectionError('Polos e acessos',e)}
}
async function newPoloAccess(){
  try{
    if(String(profile?.tipo||'').trim().toLowerCase()!=='admin')throw new Error('Só o Administrador pode atribuir acessos por polo.');
    const [pr,cc,ar]=await Promise.all([
      sb.from('perfis').select('id,nome_completo,email,tipo,ativo').eq('ativo',true).order('nome_completo'),
      sb.from('finance_centros_custo').select('id,codigo,nome').eq('ativo',true).order('nome'),
      sb.from('ciadi_centros_acesso').select('perfil_id,centro_custo_id,ativo')
    ]);
    for(const x of [pr,cc,ar])if(x.error)throw x.error;
    const existing=new Set((ar.data||[]).filter(x=>x.ativo).map(x=>x.perfil_id+'|'+x.centro_custo_id));
    const options=[];
    for(const u of pr.data||[])for(const c of cc.data||[])if(!existing.has(u.id+'|'+c.id))options.push({value:u.id+'|'+c.id,label:(u.nome_completo||u.email||u.id)+' ['+u.tipo+'] — '+c.nome});
    if(!options.length)throw new Error('Todos os pares utilizador/polo disponíveis já têm uma atribuição ativa.');
    await modal('Atribuir acesso a polo',`<div class="grid gap-4">${selectField('par','Utilizador e polo',options,'',true)}</div><p class="text-xs text-amber-800 mt-3">Esta ação regista a atribuição no servidor. Não altera automaticamente permissões das tabelas operacionais; a segurança de cada módulo continua dependente de RLS.</p>`,async fd=>{
      const [perfil_id,centro_custo_id]=String(fd.get('par')||'').split('|');
      if(!perfil_id||!centro_custo_id)throw new Error('Selecione um utilizador e um polo.');
      const {data,error}=await sb.from('ciadi_centros_acesso').insert({perfil_id,centro_custo_id,ativo:true,principal:false,criado_por:me.id}).select('id').single();
      if(error)throw error;
      await audit('ATRIBUIR_ACESSO_POLO','ciadi_centros_acesso',data.id,{perfil_id,centro_custo_id});
      toast('Atribuição registada.');closeModal();ciadiPoloAccess();
    });
  }catch(e){toast(e?.message||'Não foi possível atribuir o acesso.')}
}
async function setPoloAccessState(id,active){
  try{
    if(String(profile?.tipo||'').trim().toLowerCase()!=='admin')throw new Error('Só o Administrador pode alterar acessos por polo.');
    const {error}=await sb.from('ciadi_centros_acesso').update({ativo:active,updated_at:new Date().toISOString()}).eq('id',id);
    if(error)throw error;
    await audit(active?'REACTIVAR_ACESSO_POLO':'REVOGAR_ACESSO_POLO','ciadi_centros_acesso',id,{ativo:active});
    toast(active?'Acesso reactivado.':'Acesso revogado.');ciadiPoloAccess();
  }catch(e){toast(e?.message||'Não foi possível alterar o acesso.')}
}
async function ciadiPayroll(){
  if(!canManageHR()){document.getElementById('content').innerHTML='<div class="card p-6"><b>Acesso não autorizado.</b> A folha salarial contém dados remuneratórios confidenciais.</div>';return;}
  try{
    const sheetResult=await sb.from('ciadi_folhas_salariais').select('id,empresa_id,centro_custo_id,periodo_ano,periodo_mes,estado,data_pagamento,total_bruto,total_descontos,total_liquido,finance_centros_custo(nome,codigo)').order('periodo_ano',{ascending:false}).order('periodo_mes',{ascending:false}).limit(100);
    if(sheetResult.error){
      if(['PGRST205','42P01'].includes(sheetResult.error.code)||/ciadi_folhas_salariais/i.test(sheetResult.error.message||'')){
        tablePage('Folha salarial CIADI','Preparação de folhas mensais e emissão de recibos individuais após aprovação.',`<div class="rounded-xl border border-amber-300 bg-amber-50 text-amber-900 p-5"><h3 class="font-bold">Módulo em preparação para homologação</h3><p class="mt-2 text-sm">A estrutura de folha salarial ainda não está aplicada nesta base de dados. O Setup não deve ser distribuído com esta função ativa até a migração ser revista, aplicada com autorização e testada com utilizadores atribuídos a polos.</p><p class="mt-2 text-sm">O sistema não calculará IRT/INSS com taxas presumidas. Os valores fiscais devem ser confirmados pela Contabilidade; o recibo será gerado a partir da folha aprovada.</p></div>`);
        return;
      }
      throw sheetResult.error;
    }
    const lineResult=await sb.from('ciadi_folha_salarial_linhas').select('id,folha_id,funcionario_id,salario_base,total_subsidios,horas_extra,valor_horas_extra,irt,inss,outros_descontos,total_bruto,total_descontos,total_liquido,numero_recibo').order('created_at',{ascending:true});
    if(lineResult.error)throw lineResult.error;
    const lines=lineResult.data||[];
    const sheets=sheetResult.data||[];
    tablePage('Folha salarial CIADI','Crie uma folha por mês e polo, introduza valores validados, aprove a folha e emita recibos individuais. IRT/INSS não são calculados por taxas presumidas.',`

async function newPayrollSheet(){

async function newPayrollLine(sheetId){
  try{
    if(!canManageHR())throw new Error('Apenas Admin/Gestor autorizado pode editar a folha salarial.');
    const [staffRes,confRes]=await Promise.all([
      sb.from('ciadi_funcionarios').select('id,codigo_funcionario,profissional_id,estado,profissionais(nome_completo)').in('estado',['ativo','admissao']).order('codigo_funcionario'),
      sb.from('ciadi_funcionario_confidencial').select('funcionario_id,salario_base').limit(1000)
    ]);
    if(staffRes.error)throw staffRes.error;if(confRes.error)throw confRes.error;
    const {data:existing,error:lineError}=await sb.from('ciadi_folha_salarial_linhas').select('funcionario_id').eq('folha_id',sheetId);
    if(lineError)throw lineError;
    const already=new Set((existing||[]).map(x=>x.funcionario_id));
    const conf=Object.fromEntries((confRes.data||[]).map(x=>[x.funcionario_id,x]));
    const available=(staffRes.data||[]).filter(x=>!already.has(x.id));
    if(!available.length)throw new Error('Não existem colaboradores disponíveis para adicionar a esta folha.');
    const opts=available.map(x=>({value:x.id,label:(x.profissionais?.nome_completo||x.codigo_funcionario||'Colaborador')+' · '+(x.codigo_funcionario||'sem código')}));
    await modal('Adicionar colaborador à folha',`<div class="grid md:grid-cols-2 gap-4">${selectField('funcionario_id','Colaborador',opts,'',true)}${inputField('salario_base','Salário base (AOA)','','number',true,'min="0" step="0.01"')}${inputField('total_subsidios','Total de subsídios (AOA)','0','number',true,'min="0" step="0.01"')}${inputField('horas_extra','Horas extraordinárias','0','number',true,'min="0" step="0.01"')}${inputField('valor_horas_extra','Valor das horas extraordinárias (AOA)','0','number',true,'min="0" step="0.01"')}${inputField('irt','IRT validado (AOA)','0','number',true,'min="0" step="0.01"')}${inputField('inss','INSS validado (AOA)','0','number',true,'min="0" step="0.01"')}${inputField('outros_descontos','Outros descontos autorizados (AOA)','0','number',true,'min="0" step="0.01"')}</div><p class="text-xs text-slate-500 mt-3">Valores de IRT e INSS devem ser confirmados pela Contabilidade. O sistema calcula os totais aritméticos, não presume taxas fiscais. O salário de referência registado no RH: ${esc(available.map(x=>{const c=conf[x.id]?.salario_base;return x.codigo_funcionario+': '+(c==null?'não registado':money(c))}).join(' · '))}</p>`,async fd=>{
      const num=k=>Number(fd.get(k)||0);
      const base=num('salario_base'),subs=num('total_subsidios'),extraHours=num('horas_extra'),extraValue=num('valor_horas_extra'),irt=num('irt'),inss=num('inss'),other=num('outros_descontos');
      const vals=[base,subs,extraHours,extraValue,irt,inss,other];
      if(vals.some(x=>!Number.isFinite(x)||x<0))throw new Error('Os valores têm de ser números não negativos.');
      const gross=Math.round((base+subs+extraValue)*100)/100;
      const deductions=Math.round((irt+inss+other)*100)/100;
      const net=Math.round((gross-deductions)*100)/100;
      if(net<0)throw new Error('Os descontos não podem exceder o total bruto.');
      const row={folha_id:sheetId,funcionario_id:fd.get('funcionario_id'),salario_base:base,subsidios:{total_manual:subs},total_subsidios:subs,horas_extra:extraHours,valor_horas_extra:extraValue,descontos:{outros:other},irt,inss,outros_descontos:other,total_bruto:gross,total_descontos:deductions,total_liquido:net};
      const {data,error}=await sb.from('ciadi_folha_salarial_linhas').insert(row).select('id').single();if(error)throw error;
      await audit('ADICIONAR_COLABORADOR_FOLHA','ciadi_folha_salarial_linhas',data.id,{folha_id:sheetId,funcionario_id:row.funcionario_id,total_bruto:gross,total_liquido:net});
      toast('Colaborador adicionado à folha.');closeModal();ciadiPayroll();
    });
  }catch(e){toast(e?.message||'Não foi possível adicionar o colaborador.')}
}

tal bruto</th><td>'+fmt(line.total_bruto)+'</td></tr><tr class="total"><th>Total de descontos</th><td>'+fmt(line.total_descontos)+'</td></tr><tr class="total"><th>Valor líquido</th><td>'+fmt(line.total_liquido)+'</td></tr></tbody></table><p class="muted">Recibo gerado a partir de uma folha salarial aprovada. Os valores fiscais devem ter sido validados pela Contabilidade antes da aprovação. Este documento não substitui comprovativo bancário de pagamento.</p><p style="margin-top:55px">_________________________________<br>Responsável autorizado</p></body></html>';

function normalizeCommercialNif(value){return String(value||'').replace(/[\s.\\/-]/g,'').trim();}
function validateCommercialNifFormat(value){
  const nif=normalizeCommercialNif(value);
  if(!nif)return {ok:true,nif:'',message:'NIF não indicado.'};
  if(!/^\d{9,14}$/.test(nif))return {ok:false,nif,message:'Formato local inválido: use apenas dígitos (9 a 14), sem letras. Isto não confirma a validade oficial na AGT.'};
  return {ok:true,nif,message:'Formato plausível. A validade e a titularidade ainda não foram confirmadas pela AGT.'};
}
async function editCommercialRegistry(r=null,defaultType='cliente'){
  const x=r||{};
  await modal(r?'Editar cadastro comercial':'Novo cadastro comercial',`
    <div class="grid md:grid-cols-2 gap-4">
      ${selectField('tipo_adquirente','Categoria',[{value:'cliente',label:'Cliente'},{value:'entidade',label:'Entidade / Empresa'},{value:'fornecedor',label:'Fornecedor'}],x.tipo_adquirente||x.tipo||defaultType,true)}
      ${inputField('nome','Nome / denominação',x.nome||'','text',true)}
      ${inputField('nome_comercial','Nome comercial',x.nome_comercial||'')}
      ${inputField('nif','NIF',x.nif||'')}
      ${inputField('contacto_principal','Pessoa de contacto',x.contacto_principal||'')}
      ${inputField('telefone','Telefone',x.telefone||'')}
      ${inputField('whatsapp','WhatsApp',x.whatsapp||'')}
      ${inputField('email','E-mail',x.email||'','email')}
      ${inputField('endereco','Morada',x.endereco||'')}
      ${inputField('bairro','Bairro',x.bairro||'')}
      ${inputField('municipio','Município',x.municipio||x.cidade||'')}
      ${inputField('provincia','Província',x.provincia||'')}
      ${inputField('codigo_postal','Código postal',x.codigo_postal||'')}
      ${inputField('pais','País',x.pais||'Angola')}
      ${inputField('endereco_faturacao','Morada de faturação',x.endereco_faturacao||'')}
      ${inputField('endereco_prestacao','Morada de prestação/entrega',x.endereco_prestacao||'')}
      ${textareaField('observacoes','Observações',x.observacoes||'')}
    </div>
    <div class="rounded-xl bg-amber-50 text-amber-900 p-3 text-xs mt-3"><b>Validação local do NIF:</b> ao guardar, o CIADI normaliza espaços/pontos/barras, verifica um formato numérico plausível e procura duplicados no cadastro. Isto <b>não</b> confirma se o NIF está activo, se pertence à entidade indicada ou se é válido na AGT. A consulta oficial fica pendente de autorização/acesso da AGT.</div>
    <p class="text-xs text-slate-500 mt-3">Não introduza dados clínicos neste cadastro. Guarde apenas dados comerciais necessários.</p>`,
    async fd=>{
      const nome=(fd.get('nome')||'').trim();
      if(!nome)throw new Error('O nome/denominação é obrigatório.');
      const nifCheck=validateCommercialNifFormat(fd.get('nif'));
      if(!nifCheck.ok)throw new Error(nifCheck.message);
      const nif=nifCheck.nif||null;
      if(nif){
        const dup=await sb.from('finance_clientes').select('id,nome,nome_comercial,nif').eq('nif',nif).limit(20);
        if(dup.error)throw dup.error;
        const conflict=(dup.data||[]).find(item=>item.id!==x.id);
        if(conflict)throw new Error('Este NIF já consta no cadastro comercial ('+(conflict.nome_comercial||conflict.nome||'registo existente')+'). Verifique o registo antes de continuar.');
      }
      const category=fd.get('tipo_adquirente')||defaultType||'cliente';
      const row={nome,nome_comercial:(fd.get('nome_comercial')||'').trim()||null,nif,
        tipo:category,tipo_adquirente:category,contacto_principal:(fd.get('contacto_principal')||'').trim()||null,
        telefone:(fd.get('telefone')||'').trim()||null,whatsapp:(fd.get('whatsapp')||'').trim()||null,email:(fd.get('email')||'').trim()||null,
        endereco:(fd.get('endereco')||'').trim()||null,bairro:(fd.get('bairro')||'').trim()||null,
        municipio:(fd.get('municipio')||'').trim()||null,cidade:(fd.get('municipio')||'').trim()||null,
        provincia:(fd.get('provincia')||'').trim()||null,codigo_postal:(fd.get('codigo_postal')||'').trim()||null,
        pais:(fd.get('pais')||'Angola').trim(),endereco_faturacao:(fd.get('endereco_faturacao')||'').trim()||null,
        endereco_prestacao:(fd.get('endereco_prestacao')||'').trim()||null,observacoes:(fd.get('observacoes')||'').trim()||null,
        ativo:x.ativo===false?false:true,updated_at:new Date().toISOString()};
      const q=x.id?await sb.from('finance_clientes').update(row).eq('id',x.id).select().single():
        await sb.from('finance_clientes').insert(row).select().single();
      if(q.error)throw q.error;
      await audit(x.id?'UPDATE':'INSERT','finance_clientes',q.data.id,{categoria:row.tipo_adquirente,nome:row.nome,nif:row.nif});
      toast(x.id?'Cadastro atualizado.':'Cadastro criado.');
      closeModal();commercialRegistries();
    });
}

async function editInstitution(r){await modal('Editar instituição',`<div class="grid md:grid-cols-2 gap-4">${inputField('nome','Nome',r.nome||'','text',true)}${inputField('nome_curto','Nome curto',r.nome_curto||'')}${inputField('email','Email',r.email||'','email')}${inputField('telefone','Telefone',r.telefone||'')}${inputField('telefone_secundario','Telefone secundário',r.telefone_secundario||'')}${inputField('whatsapp','WhatsApp',r.whatsapp||'')}${inputField('website','Website',r.website||'','url')}${inputField('logo_url','Logo URL',r.logo_url||'','url')}${inputField('facebook_url','Facebook URL',r.facebook_url||'','url')}${inputField('instagram_url','Instagram URL',r.instagram_url||'','url')}${inputField('tiktok_url','TikTok URL',r.tiktok_url||'','url')}${inputField('youtube_url','YouTube URL',r.youtube_url||'','url')}${inputField('linkedin_url','LinkedIn URL',r.linkedin_url||'','url')}${inputField('cidade','Cidade',r.cidade||'')}${inputField('provincia','Província',r.provincia||'')}${textareaField('endereco','Endereço',r.endereco||'',true)}${textareaField('descricao','Descrição',r.descricao||'',true)}</div>`,async fd=>{const patch={nome:fd.get('nome'),nome_curto:fd.get('nome_curto')||null,email:fd.get('email')||null,telefone:fd.get('telefone')||null,telefone_secundario:fd.get('telefone_secundario')||null,whatsapp:fd.get('whatsapp')||null,website:fd.get('website')||null,logo_url:fd.get('logo_url')||null,facebook_url:fd.get('facebook_url')||null,instagram_url:fd.get('instagram_url')||null,tiktok_url:fd.get('tiktok_url')||null,youtube_url:fd.get('youtube_url')||null,linkedin_url:fd.get('linkedin_url')||null,cidade:fd.get('cidade')||null,provincia:fd.get('provincia')||null,endereco:fd.get('endereco')||null,descricao:fd.get('descricao')||null,updated_at:new Date().toISOString()};let q;if(r.id)q=await sb.from('instituicao').update(patch).eq('id',r.id);else q=await sb.from('instituicao').insert({...patch,ativo:true}).select().single();if(q.error)throw q.error;await audit(r.id?'UPDATE':'INSERT','instituicao',r.id||q.data?.id,patch);toast('Dados institucionais actualizados.');institution()})}
async function auditPage(){try{const {data,error}=await sb.from('auditoria').select('id,usuario_id,acao,tabela,registro_id,detalhes,user_agent,created_at').order('created_at',{ascending:false}).limit(300);if(error)throw error;tablePage('Auditoria','Registo de operações administrativas do CIADI.',`<div class="flex justify-end mb-4"><button onclick="auditPage()" class="border rounded-xl px-4 py-2">Actualizar</button></div><div class="card overflow-auto"><table class="w-full text-sm"><thead><tr class="border-b text-left"><th class="p-4">Data</th><th>Acção</th><th>Tabela</th><th>Registo</th><th>Utilizador</th><th>Detalhes</th></tr></thead><tbody>${(data||[]).map(r=>`<tr class="border-b"><td class="p-4 whitespace-nowrap">${esc(r.created_at?new Date(r.created_at).toLocaleString('pt-AO'):'')}</td><td>${esc(r.acao)}</td><td>${esc(r.tabela)}</td><td>${esc(r.registro_id||'')}</td><td>${esc(r.usuario_id||'')}</td><td class="max-w-md"><pre class="whitespace-pre-wrap text-xs">${esc(r.detalhes?JSON.stringify(r.detalhes,null,2):'')}</pre></td></tr>`).join('')}</tbody></table></div>`)}catch(e){sectionError('Auditoria',e)}}

function field(label,value){return `<div class="field"><div class="label">${esc(label)}</div><div class="value">${esc(value||'—')}</div></div>`}
function printAppointment(r){const p=r.pacientes||{},pr=r.profissionais||{},sp=r.especialidades||{};printBase('Comprovativo de Agendamento',`<div class="section"><h3>Identificação do paciente</h3><div class="grid">${field('Nome completo',p.nome_completo)}${field('ID do agendamento',r.id)}</div></div><div class="section"><h3>Dados da consulta</h3><div class="grid">${field('Data e hora',new Date(r.data_hora).toLocaleString('pt-AO'))}${field('Duração',r.duracao_minutos+' minutos')}${field('Modalidade',r.tipo==='online'?'Consulta Virtual':'Consulta Presencial')}${field('Estado',r.estado)}${field('Especialidade',sp.nome)}${field('Motivo',r.motivo)}</div></div><div class="section"><h3>Profissional responsável</h3><div class="grid">${field('Nome',pr.nome_completo)}${field('Registo profissional',pr.registro_profissional)}</div></div>${r.observacoes?`<div class="section"><h3>Observações</h3><div class="field value">${esc(r.observacoes)}</div></div>`:''}<div class="signature"><div class="line">Responsável CIADI</div><div class="line">Data de emissão</div></div>`)}

      <div class="field full"><div class="label">Comportamento</div><div class="value">${esc(r.comportamento||'Não informado')}</div></div>
      <div class="field full"><div class="label">Desenvolvimento motor</div><div class="value">${esc(r.desenvolvimento_motor||'Não informado')}</div></div>
      <div class="field full"><div class="label">Desenvolvimento da linguagem</div><div class="value">${esc(r.desenvolvimento_linguagem||'Não informado')}</div></div>
      <div class="field full"><div class="label">Informações adicionais</div><div class="value">${esc(r.informacoes_adicionais||'Não informado')}</div></div>
    </div></div>
    <div class="signature"><div class="line">Responsável CIADI</div><div class="line">Profissional</div></div>`)
}

async function boot(){
  try{
    initSupabase();
    const {data,error}=await sb.auth.getSession();
    if(error) throw error;
    if(data?.session) await enter(data.session.user);
  }catch(e){
    console.error('CIADI boot',e);
    document.getElementById('loginMsg').textContent='Não foi possível iniciar o acesso: '+(e.message||e);
  }
}
async function enter(u){
  try{
    initSupabase();
    me=u;
    const q=await sb.from('perfis').select('id,email,nome_completo,nome_exibicao,tipo,ativo,telefone').eq('id',u.id).maybeSingle();
    if(q.error) throw new Error('Não foi possível validar o perfil administrativo: '+q.error.message);
    profile=q.data;
    if(!profile){ await sb.auth.signOut(); throw new Error('O utilizador autenticado não possui perfil em public.perfis.'); }
    if(profile.ativo!==true){ await sb.auth.signOut(); throw new Error('O perfil administrativo está inactivo.'); }
    if(!['admin','gestor','profissional'].includes(profile.tipo)){ await sb.auth.signOut(); throw new Error('Este utilizador não possui acesso administrativo.'); }
    document.getElementById('login').classList.add('hiddenx');
    document.getElementById('app').classList.remove('hiddenx');
    document.getElementById('who').textContent=`${profile.nome_exibicao||profile.nome_completo||u.email} · ${profile.tipo}`;
    nav(); await go('overview');
  }catch(e){
    console.error('CIADI perfil',e);
    document.getElementById('login').classList.remove('hiddenx');
    document.getElementById('app').classList.add('hiddenx');
    document.getElementById('loginMsg').textContent=e.message||'Falha ao validar o acesso.';
  }
}
async function logout(){await sb.auth.signOut();location.reload()}
document.getElementById('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const m=document.getElementById('loginMsg');
  const emailEl=document.getElementById('email');
  const passwordEl=document.getElementById('password');
  const button=e.submitter||document.querySelector('#loginForm button');
  m.className='text-sm'; m.textContent='A autenticar…';
  if(button){button.disabled=true;button.textContent='A entrar…';}
  try{
    initSupabase();
    const email=emailEl.value.trim();
    const password=passwordEl.value;
    if(!email||!password) throw new Error('Introduza o e-mail e a palavra-passe.');
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error) throw error;
    if(!data?.user) throw new Error('O Supabase não devolveu um utilizador autenticado.');
    await enter(data.user);
  }catch(err){
    console.error('CIADI login',err);
    m.textContent=err.message||'Não foi possível entrar.';
  }finally{
    if(button){button.disabled=false;button.textContent='Entrar';}
  }
});
initSupabase();
sb.auth.onAuthStateChange((event,session)=>{
  if(event==='SIGNED_IN' && session?.user && document.getElementById('app').classList.contains('hiddenx')) enter(session.user);
  if(event==='SIGNED_OUT'){document.getElementById('app').classList.add('hiddenx');document.getElementById('login').classList.remove('hiddenx');}
});
boot();
</script></body></html>
