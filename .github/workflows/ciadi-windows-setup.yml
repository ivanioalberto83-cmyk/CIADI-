name: CIADI Windows Setup

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/ciadi-dashboard-20261028
    tags:
      - 'ciadi-v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirmar dashboard de origem
        shell: pwsh
        run: |
          $source = "CIADI_DASHBOARD_FINANCEIRO.html"
          if (!(Test-Path $source)) {
            throw "Falta o ficheiro '$source' na raiz do repositório. Carregue o dashboard financeiro CIADI para o GitHub e volte a executar."
          }
          Copy-Item $source "ciadi-windows/index.html" -Force

      - name: Criar ícone Windows a partir do logótipo CIADI
        shell: pwsh
        run: |
          $html = Get-Content "CIADI_DASHBOARD_FINANCEIRO.html" -Raw
          $match = [regex]::Match($html, "data:image/png;base64,([A-Za-z0-9+/=]+)")
          if (!$match.Success) {
            throw "Não foi encontrado um logótipo PNG incorporado no dashboard CIADI."
          }
          $png = [Convert]::FromBase64String($match.Groups[1].Value)
          $ico = New-Object byte[] (22 + $png.Length)
          $ico[0] = 0
          $ico[1] = 0
          $ico[2] = 1
          $ico[3] = 0
          $ico[4] = 1
          $ico[5] = 0
          $ico[6] = 0
          $ico[7] = 0
          [Buffer]::BlockCopy([BitConverter]::GetBytes([UInt16]1), 0, $ico, 10, 2)
          [Buffer]::BlockCopy([BitConverter]::GetBytes([UInt16]32), 0, $ico, 12, 2)
          [Buffer]::BlockCopy([BitConverter]::GetBytes([UInt32]$png.Length), 0, $ico, 14, 4)
          [Buffer]::BlockCopy([BitConverter]::GetBytes([UInt32]22), 0, $ico, 18, 4)
          [Buffer]::BlockCopy($png, 0, $ico, 22, $png.Length)
          [IO.File]::WriteAllBytes("ciadi-windows/ciadi.ico", $ico)
          Write-Host "Ícone CIADI criado a partir do logótipo oficial incorporado no dashboard."

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar e sincronizar versão da release
        if: startsWith(github.ref, 'refs/tags/ciadi-v')
        shell: pwsh
        working-directory: ciadi-windows
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^ciadi-v(\d+\.\d+\.\d+)$') {
            throw "Tag inválida: '$tag'. Use ciadi-vMAJOR.MINOR.PATCH, por exemplo ciadi-v1.0.1."
          }
          $version = $Matches[1]
          npm version $version --no-git-tag-version --allow-same-version
          Write-Host "Versão da aplicação definida para $version"

      - name: Verificar consistência e contexto seguro do Dashboard
        shell: pwsh
        run: |
          if ((Get-Content "index.html" -Raw) -cne (Get-Content "CIADI_DASHBOARD_FINANCEIRO.html" -Raw)) {
            throw "index.html e CIADI_DASHBOARD_FINANCEIRO.html estão diferentes."
          }
          $dashboard = Get-Content "CIADI_DASHBOARD_FINANCEIRO.html" -Raw
          if ($dashboard -match "function isGlobalAdmin\(\)\{ return \['admin','suporte_informatica'\]") {
            throw "Suporte Informático não pode ser administrador global."
          }
          if ($dashboard -notmatch "function canUseAgent\(\)\{ return profile\?\.tipo==='suporte_informatica' && window\.ciadiDesktop\?\.isDesktop===true; \}") {
            throw "A autorização do agente não está limitada ao perfil de suporte na aplicação desktop."
          }
          node --check "ciadi-windows/main.cjs"
          node --check "ciadi-windows/preload.cjs"
          $installer = Get-Content "ciadi-windows/build/installer.nsh" -Raw
          foreach ($profile in @("admin", "suporte_informatica", "rh", "rececao")) {
            if ($installer -notmatch [regex]::Escape($profile)) {
              throw "O seletor NSIS não contém o perfil obrigatório '$profile'."
            }
          }
          if ($installer -notmatch "Page custom CIADIProfilePage CIADIProfilePageLeave") {
            throw "O instalador não declara a página de seleção de perfil."
          }
          if ($installer -notmatch "WriteRegStr HKCU" -or $installer -notmatch "CreateShortCut") {
            throw "O instalador não guarda a identificação da estação ou não cria atalhos."
          }
          $package = Get-Content "ciadi-windows/package.json" -Raw | ConvertFrom-Json
          if ($package.build.nsis.include -ne "build/installer.nsh") {
            throw "O package.json não inclui o script NSIS personalizado."
          }
          if ($package.build.nsis.createDesktopShortcut -ne $false -or $package.build.nsis.createStartMenuShortcut -ne $false) {
            throw "Os atalhos padrão não foram desativados; podem duplicar os atalhos por perfil."
          }
          if ((Get-Content "ciadi-windows/main.cjs" -Raw) -notmatch "StationProfile") {
            throw "A aplicação não lê a identificação da estação."
          }

      - name: Gerar lockfile a partir das versões fixadas
        working-directory: ciadi-windows
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Instalar dependências de forma reproduzível
        working-directory: ciadi-windows
        run: npm ci --no-audit

      - name: Compilar Setup.exe
        working-directory: ciadi-windows
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Disponibilizar Setup.exe para teste
        if: "!startsWith(github.ref, 'refs/tags/ciadi-v')"
        uses: actions/upload-artifact@v4
        with:
          name: CIADI-Windows-Setup
          path: ciadi-windows/release/CIADI-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publicar versão para atualizações automáticas
        if: startsWith(github.ref, 'refs/tags/ciadi-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ciadi-windows/release/CIADI-Setup-*.exe
            ciadi-windows/release/latest.yml
            ciadi-windows/release/*.blockmap
          generate_release_notes: true
