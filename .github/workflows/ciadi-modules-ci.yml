name: CIADI Workstation Modules CI

on:
  push:
    branches: ['feature/ciadi-workstation-modules-20261104', 'feature/ciadi-support-operations-phase1-20261106', 'feature/ciadi-ti-document-engine-edge-functions-20261108']
    paths:
      - 'renderer/**'
      - 'CIADI_DASHBOARD_FINANCEIRO.html'
      - 'index.html'
      - 'ciadi-windows/**'
      - '.github/workflows/ciadi-modules-ci.yml'
  pull_request:
    branches: ['integration/ciadi-setup-homologacao-20261104', 'feature/ciadi-workstation-modules-20261104', 'feature/ciadi-ti-document-engine-postgres-tests-20261108']
    paths:
      - 'renderer/**'
      - 'CIADI_DASHBOARD_FINANCEIRO.html'
      - 'ciadi-windows/tests/**'
      - '.github/workflows/ciadi-modules-ci.yml'

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar sintaxe do motor e da ponte Electron
        run: |
          node --check renderer/modules/support-operations-module.js
          node --check renderer/modules/support-document-engine.js
          node --check ciadi-windows/main.cjs
          node --check ciadi-windows/preload.cjs
          node --check ciadi-windows/document-pdf-service.cjs
      - name: Executar testes de módulos e arquitectura
        run: node --test ciadi-windows/tests/*.test.cjs
