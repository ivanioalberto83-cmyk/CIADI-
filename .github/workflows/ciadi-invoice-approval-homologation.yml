name: CIADI Invoice Approval Homologation
on:
  push:
    branches:
      - feature/ciadi-reception-cashier-role-20261112
    paths:
      - 'renderer/modules/reception-module.js'
      - 'index.html'
      - 'CIADI_DASHBOARD_FINANCEIRO.html'
      - 'ciadi-windows/tests/reception-module.test.cjs'
      - 'ciadi-windows/tests/support-global-polo.test.cjs'
      - 'supabase/migrations/20261112125553_ciadi_reception_invoice_admin_approval_20261112.sql'
      - 'ciadi-windows/tests/sql/invoice-approval-*'
      - '.github/workflows/ciadi-invoice-approval-homologation.yml'
  pull_request:
    branches:
      - feature/ciadi-reception-cashier-role-20261112
    paths:
      - 'renderer/modules/reception-module.js'
      - 'ciadi-windows/tests/reception-module.test.cjs'
      - 'supabase/migrations/20261112125553_ciadi_reception_invoice_admin_approval_20261112.sql'
      - 'ciadi-windows/tests/sql/invoice-approval-*'
      - '.github/workflows/ciadi-invoice-approval-homologation.yml'
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar sintaxe
        run: node --check renderer/modules/reception-module.js
      - name: Executar testes de módulos
        run: node --test ciadi-windows/tests/*.test.cjs
  postgres-homologation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ciadi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ciadi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: ciadi_test
    steps:
      - uses: actions/checkout@v4
      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Preparar base isolada
        run: psql -v ON_ERROR_STOP=1 -f ciadi-windows/tests/sql/invoice-approval-bootstrap.sql
      - name: Aplicar migração apenas na base isolada
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261112125553_ciadi_reception_invoice_admin_approval_20261112.sql
      - name: Testar isolamento, bloqueios e aprovação ADM
        run: psql -v ON_ERROR_STOP=1 -f ciadi-windows/tests/sql/invoice-approval-test.sql
