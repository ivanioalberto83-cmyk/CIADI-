name: Inspect CIADI+ source
on: push
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q 'ciadi+ (1).zip' -d extracted
          find extracted -maxdepth 5 -type f | sort | head -500
          find extracted -maxdepth 8 -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' -o -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'gradlew' -o -name 'AndroidManifest.xml' \) -print
      - name: Package extracted source
        run: zip -qr ciadi-source-extracted.zip extracted
      - uses: actions/upload-artifact@v4
        with:
          name: ciadi-source-extracted
          path: ciadi-source-extracted.zip
          retention-days: 7
