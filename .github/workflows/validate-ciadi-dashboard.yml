name: Validate CIADI dashboard integration

on:
  pull_request:
    paths:
      - 'CIADI_DASHBOARD_FINANCEIRO.html'
      - 'index.html'
      - '.github/workflows/validate-ciadi-dashboard.yml'
      - 'supabase/migrations/**'
      - 'docs/PLANO-MIGRACAO-COMPRAS-CONTABILIDADE-PRODUCAO.md'
  push:
    branches:
      - main
    paths:
      - 'CIADI_DASHBOARD_FINANCEIRO.html'
      - 'index.html'
      - '.github/workflows/validate-ciadi-dashboard.yml'
      - 'supabase/migrations/**'
      - 'docs/PLANO-MIGRACAO-COMPRAS-CONTABILIDADE-PRODUCAO.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Confirm entry HTML matches the dashboard source
        run: cmp -s CIADI_DASHBOARD_FINANCEIRO.html index.html
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.external = False
                  self.parts = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.in_script = True
                      self.external = any(k.lower() == "src" for k, _ in attrs)

              def handle_endtag(self, tag):
                  if tag.lower() == "script":
                      self.in_script = False
                      self.external = False
                      self.parts.append("\n;\n")

              def handle_data(self, data):
                  if self.in_script and not self.external:
                      self.parts.append(data)

          parser = ScriptExtractor()
          parser.feed(Path("CIADI_DASHBOARD_FINANCEIRO.html").read_text(encoding="utf-8"))
          Path("/tmp/ciadi-inline.js").write_text("".join(parser.parts), encoding="utf-8")
          PY
          node --check /tmp/ciadi-inline.js
      - name: Verify purchase/accounting migration safety contract
        run: |
          python - <<'PY'
          from pathlib import Path
          sql = Path("supabase/migrations/20261027120000_ciadi_compras_contabilidade.sql").read_text(encoding="utf-8")
          checks = {
              "migration remains transactional": sql.strip().startswith("-- CIADI ERP") and "begin;" in sql.lower() and sql.strip().endswith("commit;"),
              "persistent supplier FK": "finance_despesas_fornecedor_id_fkey" in sql and "references public.finance_clientes(id)" in sql,
              "approval required before posting": "d.aprovacao_estado <> 'aprovada'" in sql,
              "idempotent expense posting": "where despesa_id = d.id" in sql and "uq_finance_lancamentos_despesa" in sql,
              "open accounting period required": "finance_periodos_contabeis" in sql and "estado <> 'fechado'" in sql,
              "configured purchases journal required": "codigo = 'COM'" in sql,
              "configured expense rule required": "operacao = 'DESPESA'" in sql,
              "balanced accounting validation": "perform public.finance_validar_lancamento(lanc)" in sql,
              "orders are approved explicitly": "finance_compras_aprovar_ordem" in sql and "'submetida'" in sql and "'rejeitada'" in sql,
              "no production credentials in migration": "service_role" not in sql.lower() and "supabase_service_role_key" not in sql.lower(),
          }
          for label, ok in checks.items():
              print(("PASS" if ok else "FAIL") + ": " + label)
          if not all(checks.values()):
              raise SystemExit(1)
          PY
      - name: Verify integration entry points and public-key safety
        run: |
          python - <<'PY'
          from pathlib import Path
          dashboard = Path("CIADI_DASHBOARD_FINANCEIRO.html").read_text(encoding="utf-8")
          checks = {
              "SOS receiver": "async function sosAlerts()" in dashboard and "ciadi_sos_alertas" in dashboard,
              "site intake receiver": "async function siteTriageRequests()" in dashboard and "ciadi_triagens" in dashboard,
              "navigation routes": "id==='sos'" in dashboard and "id==='pedidos_site'" in dashboard,
              "shared Supabase project": "https://egpkkttbcaukqnnxyhjv.supabase.co" in dashboard,
              "no service-role credential marker": "SUPABASE_SERVICE_ROLE_KEY" not in dashboard and "service_role" not in dashboard.lower(),
          }
          for label, ok in checks.items():
              print(("PASS" if ok else "FAIL") + ": " + label)
          if not all(checks.values()):
              raise SystemExit(1)
          PY
